name: Package atomic public-v1 release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable annotated public-v1 tag to package and, only when requested, publish
        required: true
        type: string
      exact_evidence_run_id:
        description: Successful Licensed exact-build parity run for this exact tag and commit
        required: true
        type: string
      publish:
        description: Publish only after every public-v1 target graph has been revalidated
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  SOURCE_DATE_EPOCH: "1700000000"
  BML_RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  public-v1-package-set:
    name: Build ordered public-v1 packages
    runs-on: [self-hosted, release-builder, linux, x86_64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify immutable annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$BML_RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$BML_RELEASE_TAG")" = tag
          test "$(git rev-parse "$BML_RELEASE_TAG^{}")" = "$GITHUB_SHA"
      - name: Build and seal Stash 1.0.0 before Warrior 1.0.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/public-v1-packages
          python packaging/release_evidence.py build-package --package-id bml.stash --source mods/stash --output dist/public-v1-packages/bml.stash-1.0.0.bmlpkg
          python packaging/release_evidence.py build-package --package-id jml.runebound-elixirs-warrior --source mods/runebound-elixirs --output dist/public-v1-packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg
      - name: Upload sealed ordered public-v1 packages
        if: ${{ success() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: public-v1-packages
          path: dist/public-v1-packages
          if-no-files-found: error

  linux-package:
    needs: [public-v1-package-set]
    runs-on: [self-hosted, release-builder, linux, x86_64]
    environment: release-signing
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      BML_EXACT_EVIDENCE_RUN_ID: ${{ inputs.exact_evidence_run_id }}
      BML_LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.BML_LINUX_SIGNING_PRIVATE_KEY }}
      BML_LINUX_SIGNING_PUBLIC_KEY: ${{ secrets.BML_LINUX_SIGNING_PUBLIC_KEY }}
      BML_LINUX_VERIFIER_TOOL: ${{ vars.BML_LINUX_VERIFIER_TOOL }}
      BML_LINUX_VERIFIER_IDENTITY: ${{ vars.BML_LINUX_VERIFIER_IDENTITY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Preflight Linux release runner against completed exact evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag || exit 1
          test "$GITHUB_REF_NAME" = "$BML_RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$BML_RELEASE_TAG")" = tag
          test "$(git rev-parse "$BML_RELEASE_TAG^{}")" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "${{ github.sha }}"
          test "$(gh run view "$BML_EXACT_EVIDENCE_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$BML_EXACT_EVIDENCE_RUN_ID" --json workflowName --jq .workflowName)" = "Licensed exact-build parity"
          test "$(gh run view "$BML_EXACT_EVIDENCE_RUN_ID" --json headSha --jq .headSha)" = "$GITHUB_SHA"
          test "$(gh run view "$BML_EXACT_EVIDENCE_RUN_ID" --json headBranch --jq .headBranch)" = "$BML_RELEASE_TAG"
          for value in BML_LINUX_SIGNING_PRIVATE_KEY BML_LINUX_SIGNING_PUBLIC_KEY BML_LINUX_VERIFIER_TOOL BML_LINUX_VERIFIER_IDENTITY; do test -n "${!value}" || { echo "$value is unavailable" >&2; exit 1; }; done
          command -v minisign >/dev/null || { echo 'minisign is unavailable' >&2; exit 1; }
          test -x "$BML_LINUX_VERIFIER_TOOL" || { echo 'configured Linux verifier is unavailable' >&2; exit 1; }
          "$BML_LINUX_VERIFIER_TOOL" --version | grep -E "^$(basename "$BML_LINUX_VERIFIER_TOOL") [0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$" >/dev/null || exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-v1-packages
          path: dist/release/linux-x86_64/packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: exact-build-linux-x86_64
          path: dist/release/linux-x86_64/evidence/linux-x86_64
          github-token: ${{ github.token }}
          run-id: ${{ env.BML_EXACT_EVIDENCE_RUN_ID }}
      - name: Build final Linux distribution
        shell: bash
        run: |
          set -euo pipefail
          for tool in pyinstaller appimagetool cyclonedx-py gh xvfb-run; do command -v "$tool" >/dev/null || exit 1; done
          test -f native/barony-modloader-hook/build/libbarony_bml.so || exit 1
          test -s dist/release/linux-x86_64/packages/bml.stash-1.0.0.bmlpkg || exit 1
          test -s dist/release/linux-x86_64/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg || exit 1
          python packaging/release_evidence.py validate-exact --input dist/release/linux-x86_64/evidence/linux-x86_64/exact-build.json --os linux --architecture x86_64 --digest-output dist/release/linux-x86_64/evidence/linux-x86_64/exact-build.json.sha256 || exit 1
          packaging/linux/build.sh
          test -s dist/release/linux-x86_64/BaronyModLoader-linux-x86_64.tar.gz || exit 1
          test -s dist/release/linux-x86_64/BaronyModLoader-linux-x86_64.AppImage || exit 1
      - id: linux-cli-smoke-gui-smoke
        name: Launch Linux CLI and GUI from the release archive
        shell: bash
        env:
          BML_GUI_SMOKE_PREFIX: xvfb-run -a
        run: |
          set -euo pipefail
          ROOT=dist/release/linux-x86_64
          python packaging/release_evidence.py smoke-package --release-root "$ROOT" --archive "$ROOT/BaronyModLoader-linux-x86_64.tar.gz" --cli AppDir/usr/bin/BaronyModLoader/bml --gui AppDir/usr/bin/BaronyModLoader/BaronyModLoader --gui-report-output "$ROOT/evidence/gui-smoke.json" --output "$ROOT/package-smoke.json" || exit 1
          test -s "$ROOT/package-smoke.json" || exit 1
          test -s "$ROOT/evidence/gui-smoke.json" || exit 1
          sha256sum "$ROOT/package-smoke.json" > "$ROOT/package-smoke.json.sha256" || exit 1
      - name: Record Linux platform trust after packaged smoke
        shell: bash
        env:
          BML_GUI_SMOKE_PREFIX: xvfb-run -a
        run: |
          set -euo pipefail
          ROOT=dist/release/linux-x86_64
          mkdir -p "$ROOT/evidence/trust"
          python packaging/release_evidence.py smoke-package --release-root "$ROOT" --archive "$ROOT/BaronyModLoader-linux-x86_64.tar.gz" --cli AppDir/usr/bin/BaronyModLoader/bml --gui AppDir/usr/bin/BaronyModLoader/BaronyModLoader --gui-report-output "$ROOT/evidence/trust/archive-gui-smoke.json" --evidence-kind archiveSmoke --output "$ROOT/evidence/trust/archive-smoke-tool.json" || exit 1
          python packaging/release_evidence.py smoke-package --release-root "$ROOT" --cli "$ROOT/BaronyModLoader-linux-x86_64.AppImage" --gui "$ROOT/BaronyModLoader-linux-x86_64.AppImage" --gui-report-output "$ROOT/evidence/trust/appimage-gui-smoke.json" --evidence-kind appImageSmoke --output "$ROOT/evidence/trust/appimage-smoke-tool.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind archiveSmoke --subject "$ROOT/BaronyModLoader-linux-x86_64.tar.gz" --tool-output "$ROOT/evidence/trust/archive-smoke-tool.json" --verifier-tool bml-smoke-package --verifier-identity archiveSmoke --verifier-version 1.0.0 --output "$ROOT/evidence/trust/archive-smoke.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind appImageSmoke --subject "$ROOT/BaronyModLoader-linux-x86_64.tar.gz" --subject "$ROOT/BaronyModLoader-linux-x86_64.AppImage" --tool-output "$ROOT/evidence/trust/appimage-smoke-tool.json" --verifier-tool bml-smoke-package --verifier-identity appImageSmoke --verifier-version 1.0.0 --output "$ROOT/evidence/trust/appimage-smoke.json" || exit 1
          python - "$ROOT/evidence/platform-trust.json" "$ROOT/evidence/trust/archive-smoke.json" "$ROOT/evidence/trust/appimage-smoke.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          proofs = [Path(value) for value in sys.argv[2:]]
          if not all(path.is_file() and path.stat().st_size for path in proofs):
              raise SystemExit("platform trust proof is missing")
          output.write_text(json.dumps({"formatVersion": "1.0.0", "status": "verified", "proofs": [{"path": path.name, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()} for path in proofs]}, sort_keys=True) + "\n", encoding="utf-8")
          PY
          cyclonedx-py environment --output-file "$ROOT/BaronyModLoader-linux-x86_64.cdx.json" || exit 1
      - name: Sign and validate the exact final Linux archive then AppImage
        shell: bash
        run: |
          set -euo pipefail
          ROOT=dist/release/linux-x86_64
          PRIVATE_KEY="$RUNNER_TEMP/bml-linux-release-$$.key"
          cleanup_private_key() {
            if test -f "$PRIVATE_KEY"; then
              chmod 600 "$PRIVATE_KEY"
              if command -v shred >/dev/null; then shred -u "$PRIVATE_KEY"; else rm -f "$PRIVATE_KEY"; fi
            fi
          }
          trap cleanup_private_key EXIT
          mkdir -p "$ROOT/evidence"
          umask 077
          printf '%s\n' "$BML_LINUX_SIGNING_PRIVATE_KEY" > "$PRIVATE_KEY"
          printf '%s\n' "$BML_LINUX_SIGNING_PUBLIC_KEY" > "$ROOT/evidence/linux-release.pub"
          chmod 600 "$PRIVATE_KEY"
          chmod 644 "$ROOT/evidence/linux-release.pub"
          test -s "$PRIVATE_KEY" && test -s "$ROOT/evidence/linux-release.pub" || exit 1
          python - "$ROOT" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          subjects = [
              {"role": "archive", "path": "BaronyModLoader-linux-x86_64.tar.gz", "sha256": hashlib.sha256((root / "BaronyModLoader-linux-x86_64.tar.gz").read_bytes()).hexdigest()},
              {"role": "appImage", "path": "BaronyModLoader-linux-x86_64.AppImage", "sha256": hashlib.sha256((root / "BaronyModLoader-linux-x86_64.AppImage").read_bytes()).hexdigest()},
          ]
          payload = {"formatVersion": "1.0.0", "kind": "linux-release-digests", "subjects": subjects}
          (root / "evidence" / "linux-release-digests.json").write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          minisign -S -s "$PRIVATE_KEY" -m "$ROOT/evidence/linux-release-digests.json" -x "$ROOT/evidence/linux-release-digests.json.minisig"
          test -s "$ROOT/evidence/linux-release-digests.json.minisig" || exit 1
          minisign -v > "$RUNNER_TEMP/minisign-version-$$.txt" 2>&1
          VERIFIER_VERSION_LINE=$("$BML_LINUX_VERIFIER_TOOL" --version)
          python - "$ROOT" "$RUNNER_TEMP/minisign-version-$$.txt" "$VERIFIER_VERSION_LINE" "$BML_LINUX_VERIFIER_TOOL" "$BML_LINUX_VERIFIER_IDENTITY" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          root, minisign_version, verifier_line, verifier_tool, verifier_identity = sys.argv[1:]
          root = Path(root)
          version_match = re.search(r"\b([0-9]+\.[0-9]+(?:\.[0-9]+)?(?:[-+][0-9A-Za-z.-]+)?)\b", Path(minisign_version).read_text(encoding="utf-8"))
          if version_match is None:
              raise SystemExit("minisign did not report a semantic version")
          verifier_name = Path(verifier_tool).name
          prefix = f"{verifier_name} "
          if not verifier_line.startswith(prefix) or re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?", verifier_line[len(prefix):]) is None:
              raise SystemExit("Linux verifier did not report the required identity and semantic version")
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          payload = root / "evidence" / "linux-release-digests.json"
          signature = root / "evidence" / "linux-release-digests.json.minisig"
          public_key = root / "evidence" / "linux-release.pub"
          receipt = {
              "formatVersion": "1.0.0",
              "kind": "linux-detached-signature",
              "status": "verified",
              "evidenceSource": "credential-gated-release-signing",
              "subjects": json.loads(payload.read_text(encoding="utf-8"))["subjects"],
              "signedPayload": {"path": "evidence/linux-release-digests.json", "sha256": digest(payload)},
              "detachedSignature": {"path": "evidence/linux-release-digests.json.minisig", "sha256": digest(signature), "format": "minisign"},
              "signer": {"tool": "minisign", "version": version_match.group(1), "keyFingerprint": digest(public_key)},
              "verifier": {"tool": verifier_name, "version": verifier_line[len(prefix):], "identity": verifier_identity, "keyFingerprint": digest(public_key)},
          }
          (root / "evidence" / "linux-detached-signature.json").write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          rm -f "$RUNNER_TEMP/minisign-version-$$.txt"
          python packaging/release_evidence.py validate-linux-signature --input evidence/linux-detached-signature.json --release-root "$ROOT" --archive BaronyModLoader-linux-x86_64.tar.gz --appimage BaronyModLoader-linux-x86_64.AppImage --public-key evidence/linux-release.pub --verifier-tool "$BML_LINUX_VERIFIER_TOOL" --verifier-identity "$BML_LINUX_VERIFIER_IDENTITY"
          cleanup_private_key
          trap - EXIT
      - id: provenance
        name: Attest final Linux applications and ordered packages
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/release/linux-x86_64/BaronyModLoader-linux-x86_64.AppImage
            dist/release/linux-x86_64/BaronyModLoader-linux-x86_64.tar.gz
            dist/release/linux-x86_64/packages/bml.stash-1.0.0.bmlpkg
            dist/release/linux-x86_64/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg
            dist/release/linux-x86_64/evidence/trust/archive-smoke.json
            dist/release/linux-x86_64/evidence/trust/appimage-smoke.json
            dist/release/linux-x86_64/evidence/platform-trust.json
            dist/release/linux-x86_64/evidence/linux-release.pub
            dist/release/linux-x86_64/evidence/linux-release-digests.json
            dist/release/linux-x86_64/evidence/linux-release-digests.json.minisig
            dist/release/linux-x86_64/evidence/linux-detached-signature.json
      - name: Decide advertised Linux target input status for atomic promotion
        shell: bash
        run: |
          set -euo pipefail
          ROOT=dist/release/linux-x86_64
          cp "${{ steps.provenance.outputs.bundle-path }}" "$ROOT/BaronyModLoader-linux-x86_64.intoto.jsonl"
          advertised=true
          for evidence in "$ROOT/evidence/linux-x86_64/exact-build.json" "$ROOT/evidence/linux-x86_64/exact-build.json.sha256" "$ROOT/package-smoke.json" "$ROOT/package-smoke.json.sha256" "$ROOT/evidence/gui-smoke.json" "$ROOT/evidence/platform-trust.json" "$ROOT/evidence/linux-release.pub" "$ROOT/evidence/linux-release-digests.json" "$ROOT/evidence/linux-release-digests.json.minisig" "$ROOT/evidence/linux-detached-signature.json" "$ROOT/BaronyModLoader-linux-x86_64.intoto.jsonl" "$ROOT/BaronyModLoader-linux-x86_64.cdx.json" "$ROOT/packages/bml.stash-1.0.0.bmlpkg" "$ROOT/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg" "$ROOT/AppDir/usr/lib/libbarony_bml.so" "$ROOT/AppDir/AppRun"; do test -s "$evidence" || advertised=false; done
          test -f "$ROOT/evidence/linux-x86_64/gates/semantic.json" || { echo 'missing Linux semantic gate' >&2; exit 1; }
          test -f "$ROOT/evidence/linux-x86_64/gates/lua.json" || { echo 'missing Linux lua gate' >&2; exit 1; }
          test -f "$ROOT/evidence/linux-x86_64/gates/save.json" || { echo 'missing Linux save gate' >&2; exit 1; }
          test -f "$ROOT/evidence/linux-x86_64/gates/network.json" || { echo 'missing Linux network gate' >&2; exit 1; }
          test -f "$ROOT/evidence/linux-x86_64/gates/platform.json" || { echo 'missing Linux platform gate' >&2; exit 1; }
          test "$advertised" = true || { echo 'advertised=false: complete Linux target evidence is required' >&2; exit 1; }
          printf '{"formatVersion":"1.0.0","target":"linux-x86_64","advertised":true}\n' > "$ROOT/advertised-status.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: ${{ success() }}
        with:
          name: BaronyModLoader-linux-x86_64
          path: dist/release/linux-x86_64
          if-no-files-found: error

  windows-package:
    needs: [public-v1-package-set]
    runs-on: [self-hosted, release-builder, windows, x86_64]
    environment: release-signing
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      BML_EXACT_EVIDENCE_RUN_ID: ${{ inputs.exact_evidence_run_id }}
      BML_WINDOWS_CERTIFICATE_PFX: ${{ secrets.BML_WINDOWS_CERTIFICATE_PFX }}
      BML_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.BML_WINDOWS_CERTIFICATE_PASSWORD }}
      BML_WINDOWS_TIMESTAMP_URL: ${{ vars.BML_WINDOWS_TIMESTAMP_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Preflight Windows signing runner against completed exact evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne $env:BML_RELEASE_TAG) { throw 'wrong release ref' }
          if ((git cat-file -t "refs/tags/$env:BML_RELEASE_TAG") -ne 'tag') { throw 'release ref is not annotated' }
          if ((git rev-parse "$env:BML_RELEASE_TAG^{}") -ne $env:GITHUB_SHA) { throw 'release commit mismatch' }
          if ($env:GITHUB_SHA -ne '${{ github.sha }}') { throw 'workflow commit identity mismatch' }
          if ((gh run view $env:BML_EXACT_EVIDENCE_RUN_ID --json conclusion --jq .conclusion) -ne 'success') { throw 'exact public-v1 graph did not succeed' }
          if ((gh run view $env:BML_EXACT_EVIDENCE_RUN_ID --json workflowName --jq .workflowName) -ne 'Licensed exact-build parity') { throw 'wrong exact workflow' }
          if ((gh run view $env:BML_EXACT_EVIDENCE_RUN_ID --json headSha --jq .headSha) -ne $env:GITHUB_SHA) { throw 'exact commit mismatch' }
          if ((gh run view $env:BML_EXACT_EVIDENCE_RUN_ID --json headBranch --jq .headBranch) -ne $env:BML_RELEASE_TAG) { throw 'exact tag mismatch' }
          if (-not $env:BML_WINDOWS_CERTIFICATE_PFX -or -not $env:BML_WINDOWS_CERTIFICATE_PASSWORD -or -not $env:BML_WINDOWS_TIMESTAMP_URL) { throw 'Windows signing credentials are unavailable' }
          foreach ($tool in @('pyinstaller', 'signtool', 'cyclonedx-py', 'gh', 'Start-MpScan')) { if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "$tool is unavailable" } }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-v1-packages
          path: dist/release/windows-x86_64/packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: exact-build-windows-x86_64
          path: dist/release/windows-x86_64/evidence/windows-x86_64
          github-token: ${{ github.token }}
          run-id: ${{ env.BML_EXACT_EVIDENCE_RUN_ID }}
      - name: Build final Windows distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($package in @('dist/release/windows-x86_64/packages/bml.stash-1.0.0.bmlpkg', 'dist/release/windows-x86_64/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg')) { if (-not (Test-Path -LiteralPath $package -PathType Leaf)) { throw "missing package: $package" } }
          python packaging/release_evidence.py validate-exact --input dist/release/windows-x86_64/evidence/windows-x86_64/exact-build.json --os windows --architecture x86_64 --digest-output dist/release/windows-x86_64/evidence/windows-x86_64/exact-build.json.sha256
          if ($LASTEXITCODE -ne 0) { throw 'exact evidence did not validate' }
          $ReadinessRoot = (Resolve-Path 'dist/release/windows-x86_64/evidence/windows-x86_64').Path
          $ExactPath = Join-Path $ReadinessRoot 'exact-build.json'
          $ExactDocument = Get-Content -LiteralPath $ExactPath -Raw | ConvertFrom-Json
          $env:BML_WINDOWS_NATIVE_DLL = (Resolve-Path (Join-Path (Split-Path -Parent $ExactPath) $ExactDocument.adapter.artifactPath)).Path
          $env:BML_TARGET_READINESS_ROOT = $ReadinessRoot
          $env:BML_WINDOWS_X86_64_READINESS_RECEIPT = Join-Path $ReadinessRoot 'target-readiness.json'
          python packaging/release_evidence.py validate-target-readiness --input $env:BML_WINDOWS_X86_64_READINESS_RECEIPT --release-root $env:BML_TARGET_READINESS_ROOT --os windows --architecture x86_64 --subject $env:BML_WINDOWS_NATIVE_DLL
          if ($LASTEXITCODE -ne 0) { throw 'Windows target readiness did not admit signing' }
          ./packaging/windows/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows package build failed' }
          if (-not (Test-Path 'dist/release/windows-x86_64/BaronyModLoader-windows-x86_64.zip' -PathType Leaf)) { throw 'Windows archive is missing after build' }
      - id: windows-cli-smoke-gui-smoke
        name: Launch Windows CLI and GUI from the release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = 'dist/release/windows-x86_64'
          python packaging/release_evidence.py smoke-package --release-root $Root --archive "$Root/BaronyModLoader-windows-x86_64.zip" --cli BaronyModLoader-windows-x86_64/bml.exe --gui BaronyModLoader-windows-x86_64/BaronyModLoader.exe --gui-report-output "$Root/evidence/gui-smoke.json" --output "$Root/package-smoke.json"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$Root/package-smoke.json" -PathType Leaf) -or -not (Test-Path "$Root/evidence/gui-smoke.json" -PathType Leaf)) { throw 'packaged CLI or GUI smoke failed' }
          $SmokeHash = (Get-FileHash -Algorithm SHA256 "$Root/package-smoke.json").Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$Root/package-smoke.json.sha256", "$SmokeHash  package-smoke.json`n", [System.Text.Encoding]::ASCII)
          if (-not (Test-Path "$Root/package-smoke.json.sha256" -PathType Leaf)) { throw 'package smoke hash is missing' }
      - name: Record Windows platform trust after packaged smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = 'dist/release/windows-x86_64'; $Trust = "$Root/evidence/trust"; New-Item -ItemType Directory -Force $Trust | Out-Null
          $Launcher = "$Root/BaronyModLoader-windows-x86_64/bml-win-launcher.exe"; $Archive = "$Root/BaronyModLoader-windows-x86_64.zip"
          & signtool verify /pa /v $Launcher *> "$Trust/authenticode-tool.txt"; if ($LASTEXITCODE -ne 0) { throw 'signature verification failed' }
          & signtool verify /pa /all /v $Launcher *> "$Trust/timestamp-tool.txt"; if ($LASTEXITCODE -ne 0) { throw 'timestamp verification failed' }
          Start-MpScan -ScanType CustomScan -ScanPath $Archive
          $threats = @(Get-MpThreatDetection | Where-Object { $_.Resources -like "*$Archive*" }); $threats | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "$Trust/antivirus-tool.json"; if ($threats.Count -ne 0) { throw 'antivirus reported final archive' }
          python packaging/release_evidence.py record-proof --release-root $Root --kind authenticode --subject $Archive --subject $Launcher --tool-output "$Trust/authenticode-tool.txt" --verifier-tool signtool --verifier-identity Authenticode --verifier-version 10.0 --output "$Trust/authenticode.json"; if ($LASTEXITCODE -ne 0) { throw 'authenticode trust receipt failed' }
          python packaging/release_evidence.py record-proof --release-root $Root --kind timestamp --subject $Archive --subject $Launcher --tool-output "$Trust/timestamp-tool.txt" --verifier-tool signtool --verifier-identity RFC3161 --verifier-version 10.0 --output "$Trust/timestamp.json"; if ($LASTEXITCODE -ne 0) { throw 'timestamp trust receipt failed' }
          python packaging/release_evidence.py record-proof --release-root $Root --kind antivirus --subject $Archive --tool-output "$Trust/antivirus-tool.json" --verifier-tool microsoft-defender --verifier-identity antimalware-scan --verifier-version 1.0 --output "$Trust/antivirus.json"; if ($LASTEXITCODE -ne 0) { throw 'antivirus trust receipt failed' }
          python -c "import hashlib,json,sys; from pathlib import Path; output=Path(sys.argv[1]); proofs=[Path(value) for value in sys.argv[2:]]; (all(path.is_file() and path.stat().st_size for path in proofs) or (_ for _ in ()).throw(SystemExit('platform trust proof is missing'))); output.write_text(json.dumps({'formatVersion':'1.0.0','status':'verified','proofs':[{'path':path.name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()} for path in proofs]}, sort_keys=True)+'\n', encoding='utf-8')" "$Root/evidence/platform-trust.json" "$Trust/authenticode.json" "$Trust/timestamp.json" "$Trust/antivirus.json"
          if ($LASTEXITCODE -ne 0) { throw 'platform trust aggregation failed' }
          cyclonedx-py environment --output-file "$Root/BaronyModLoader-windows-x86_64.cdx.json"; if ($LASTEXITCODE -ne 0) { throw 'SBOM generation failed' }
      - id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/release/windows-x86_64/BaronyModLoader-windows-x86_64.zip
            dist/release/windows-x86_64/packages/bml.stash-1.0.0.bmlpkg
            dist/release/windows-x86_64/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg
            dist/release/windows-x86_64/BaronyModLoader-windows-x86_64/bml-win-launcher.exe
            dist/release/windows-x86_64/evidence/trust/authenticode.json
            dist/release/windows-x86_64/evidence/trust/timestamp.json
            dist/release/windows-x86_64/evidence/trust/antivirus.json
            dist/release/windows-x86_64/evidence/platform-trust.json
      - name: Decide advertised Windows target input status for atomic promotion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $Root = 'dist/release/windows-x86_64'
          Copy-Item -LiteralPath '${{ steps.provenance.outputs.bundle-path }}' -Destination "$Root/BaronyModLoader-windows-x86_64.intoto.jsonl"
          $advertised = $true
          foreach ($evidence in @("$Root/evidence/windows-x86_64/exact-build.json", "$Root/evidence/windows-x86_64/exact-build.json.sha256", "$Root/package-smoke.json", "$Root/package-smoke.json.sha256", "$Root/evidence/gui-smoke.json", "$Root/evidence/platform-trust.json", "$Root/BaronyModLoader-windows-x86_64.intoto.jsonl", "$Root/BaronyModLoader-windows-x86_64.cdx.json", "$Root/packages/bml.stash-1.0.0.bmlpkg", "$Root/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg", "$Root/BaronyModLoader-windows-x86_64/barony_bml.dll", "$Root/BaronyModLoader-windows-x86_64/bml-win-launcher.exe")) { if (-not (Test-Path -LiteralPath $evidence -PathType Leaf)) { $advertised = $false } }
          if (-not (Test-Path -LiteralPath "$Root/evidence/windows-x86_64/gates/semantic.json" -PathType Leaf)) { throw 'missing Windows semantic gate' }
          if (-not (Test-Path -LiteralPath "$Root/evidence/windows-x86_64/gates/lua.json" -PathType Leaf)) { throw 'missing Windows lua gate' }
          if (-not (Test-Path -LiteralPath "$Root/evidence/windows-x86_64/gates/save.json" -PathType Leaf)) { throw 'missing Windows save gate' }
          if (-not (Test-Path -LiteralPath "$Root/evidence/windows-x86_64/gates/network.json" -PathType Leaf)) { throw 'missing Windows network gate' }
          if (-not (Test-Path -LiteralPath "$Root/evidence/windows-x86_64/gates/platform.json" -PathType Leaf)) { throw 'missing Windows platform gate' }
          if (-not $advertised) { throw 'advertised=false: complete Windows target evidence is required' }
          '{"formatVersion":"1.0.0","target":"windows-x86_64","advertised":true}' | Set-Content -Encoding utf8 "$Root/advertised-status.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: ${{ success() }}
        with:
          name: BaronyModLoader-windows-x86_64
          path: dist/release/windows-x86_64
          if-no-files-found: error

  macos-package:
    needs: [public-v1-package-set]
    runs-on: [self-hosted, release-builder, macos, universal2]
    environment: release-signing
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      BML_EXACT_EVIDENCE_RUN_ID: ${{ inputs.exact_evidence_run_id }}
      BML_MACOS_CODESIGN_IDENTITY: ${{ secrets.BML_MACOS_CODESIGN_IDENTITY }}
      BML_MACOS_X86_64_DYLIB: ${{ vars.BML_MACOS_X86_64_DYLIB }}
      BML_MACOS_ARM64_DYLIB: ${{ vars.BML_MACOS_ARM64_DYLIB }}
      BML_APPLE_ID: ${{ secrets.BML_APPLE_ID }}
      BML_APPLE_TEAM_ID: ${{ secrets.BML_APPLE_TEAM_ID }}
      BML_APPLE_APP_PASSWORD: ${{ secrets.BML_APPLE_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Preflight macOS signing runner credentials and exact evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view "$BML_EXACT_EVIDENCE_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$BML_RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$BML_RELEASE_TAG")" = tag
          test "$(git rev-parse "$BML_RELEASE_TAG^{}")" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "${{ github.sha }}"
          test "$(gh run view "$BML_EXACT_EVIDENCE_RUN_ID" --json workflowName --jq .workflowName)" = "Licensed exact-build parity"
          test "$(gh run view "$BML_EXACT_EVIDENCE_RUN_ID" --json headSha --jq .headSha)" = "$GITHUB_SHA"
          test "$(gh run view "$BML_EXACT_EVIDENCE_RUN_ID" --json headBranch --jq .headBranch)" = "$BML_RELEASE_TAG"
          for value in BML_MACOS_CODESIGN_IDENTITY BML_MACOS_X86_64_DYLIB BML_MACOS_ARM64_DYLIB BML_APPLE_ID BML_APPLE_TEAM_ID BML_APPLE_APP_PASSWORD; do test -n "${!value}" || exit 1; done
          for tool in pyinstaller codesign spctl xcrun lipo cyclonedx-py gh; do command -v "$tool" >/dev/null || exit 1; done
          test -f "$BML_MACOS_X86_64_DYLIB" || exit 1
          test -f "$BML_MACOS_ARM64_DYLIB" || exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-v1-packages
          path: dist/release/macos-universal2/packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: exact-build-macos-x86_64
          path: dist/release/macos-universal2/evidence/macos-x86_64
          github-token: ${{ github.token }}
          run-id: ${{ env.BML_EXACT_EVIDENCE_RUN_ID }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: exact-build-macos-arm64
          path: dist/release/macos-universal2/evidence/macos-arm64
          github-token: ${{ github.token }}
          run-id: ${{ env.BML_EXACT_EVIDENCE_RUN_ID }}
      - name: Build sign notarize and staple universal macOS distribution
        shell: bash
        run: |
          set -euo pipefail
          ROOT=dist/release/macos-universal2
          test -s "$ROOT/packages/bml.stash-1.0.0.bmlpkg" || exit 1
          test -s "$ROOT/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg" || exit 1
          python packaging/release_evidence.py validate-exact --input "$ROOT/evidence/macos-x86_64/exact-build.json" --os macos --architecture x86_64 --digest-output "$ROOT/evidence/macos-x86_64/exact-build.json.sha256" || exit 1
          python packaging/release_evidence.py validate-exact --input "$ROOT/evidence/macos-arm64/exact-build.json" --os macos --architecture arm64 --digest-output "$ROOT/evidence/macos-arm64/exact-build.json.sha256" || exit 1
          resolve_adapter() {
            python - "$1" <<'PY'
          import json
          import sys
          from pathlib import Path
          exact_path = Path(sys.argv[1]).resolve()
          document = json.loads(exact_path.read_text(encoding="utf-8"))
          print((exact_path.parent / document["adapter"]["artifactPath"]).resolve())
          PY
          }
          export BML_MACOS_X86_64_READINESS_ROOT="$ROOT/evidence/macos-x86_64"
          export BML_MACOS_X86_64_READINESS_RECEIPT="$BML_MACOS_X86_64_READINESS_ROOT/target-readiness.json"
          export BML_MACOS_X86_64_DYLIB="$(resolve_adapter "$BML_MACOS_X86_64_READINESS_ROOT/exact-build.json")"
          export BML_MACOS_ARM64_READINESS_ROOT="$ROOT/evidence/macos-arm64"
          export BML_MACOS_ARM64_READINESS_RECEIPT="$BML_MACOS_ARM64_READINESS_ROOT/target-readiness.json"
          export BML_MACOS_ARM64_DYLIB="$(resolve_adapter "$BML_MACOS_ARM64_READINESS_ROOT/exact-build.json")"
          python packaging/release_evidence.py validate-target-readiness --input "$BML_MACOS_X86_64_READINESS_RECEIPT" --release-root "$BML_MACOS_X86_64_READINESS_ROOT" --os macos --architecture x86_64 --subject "$BML_MACOS_X86_64_DYLIB" || exit 1
          python packaging/release_evidence.py validate-target-readiness --input "$BML_MACOS_ARM64_READINESS_RECEIPT" --release-root "$BML_MACOS_ARM64_READINESS_ROOT" --os macos --architecture arm64 --subject "$BML_MACOS_ARM64_DYLIB" || exit 1
          packaging/macos/build.sh
          test -s "$ROOT/BaronyModLoader-macos-universal2.zip" || exit 1
      - id: macos-cli-smoke-gui-smoke
        name: Launch macOS CLI and GUI from the release archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT=dist/release/macos-universal2
          python packaging/release_evidence.py smoke-package --release-root "$ROOT" --archive "$ROOT/BaronyModLoader-macos-universal2.zip" --cli BaronyModLoader.app/Contents/MacOS/bml --gui BaronyModLoader.app/Contents/MacOS/BaronyModLoader --gui-report-output "$ROOT/evidence/gui-smoke.json" --output "$ROOT/package-smoke.json" || exit 1
          test -s "$ROOT/package-smoke.json" || exit 1
          test -s "$ROOT/evidence/gui-smoke.json" || exit 1
          shasum -a 256 "$ROOT/package-smoke.json" > "$ROOT/package-smoke.json.sha256" || exit 1
      - name: Record macOS platform trust after packaged smoke
        shell: bash
        run: |
          set -euo pipefail
          ROOT=dist/release/macos-universal2
          TRUST="$ROOT/evidence/trust"; APP="$ROOT/BaronyModLoader.app"; LAUNCHER="$APP/Contents/MacOS/BaronyModLoader"; mkdir -p "$TRUST"
          codesign --verify --deep --strict --verbose=4 "$APP" >"$TRUST/code-signature-tool.txt" 2>&1
          xcrun notarytool history --apple-id "$BML_APPLE_ID" --team-id "$BML_APPLE_TEAM_ID" --password "$BML_APPLE_APP_PASSWORD" >"$TRUST/notarization-tool.txt" 2>&1
          spctl --assess --type execute --verbose=4 "$APP" >>"$TRUST/notarization-tool.txt" 2>&1
          xcrun stapler validate -v "$APP" >"$TRUST/stapling-tool.txt" 2>&1
          { xattr -p com.apple.quarantine "$APP"; spctl --assess --type execute --verbose=4 "$APP"; } >"$TRUST/quarantine-tool.txt" 2>&1
          for target in macos-x86_64 macos-arm64; do
            mkdir -p "$TRUST/$target"
            cp "$TRUST/code-signature-tool.txt" "$TRUST/$target/code-signature-tool.txt"
            cp "$TRUST/notarization-tool.txt" "$TRUST/$target/notarization-tool.txt"
            cp "$TRUST/stapling-tool.txt" "$TRUST/$target/stapling-tool.txt"
            cp "$TRUST/quarantine-tool.txt" "$TRUST/$target/quarantine-tool.txt"
          done
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind codeSignature --subject "$ROOT/BaronyModLoader-macos-universal2.zip" --subject "$LAUNCHER" --tool-output "$TRUST/code-signature-tool.txt" --verifier-tool codesign --verifier-identity designated-requirement --verifier-version 1.0 --output "$TRUST/code-signature.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind notarization --subject "$ROOT/BaronyModLoader-macos-universal2.zip" --subject "$LAUNCHER" --tool-output "$TRUST/notarization-tool.txt" --verifier-tool notarytool --verifier-identity accepted --verifier-version 1.0 --output "$TRUST/notarization.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind stapling --subject "$ROOT/BaronyModLoader-macos-universal2.zip" --subject "$LAUNCHER" --tool-output "$TRUST/stapling-tool.txt" --verifier-tool stapler --verifier-identity validate --verifier-version 1.0 --output "$TRUST/stapling.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind quarantine --subject "$ROOT/BaronyModLoader-macos-universal2.zip" --subject "$LAUNCHER" --tool-output "$TRUST/quarantine-tool.txt" --verifier-tool spctl --verifier-identity Gatekeeper-assessment --verifier-version 1.0 --output "$TRUST/quarantine.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind codeSignature --subject "$ROOT/BaronyModLoader-macos-universal2.zip" --subject "$LAUNCHER" --tool-output "$TRUST/macos-x86_64/code-signature-tool.txt" --verifier-tool codesign --verifier-identity designated-requirement --verifier-version 1.0 --output "$TRUST/macos-x86_64/code-signature.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind notarization --subject "$ROOT/BaronyModLoader-macos-universal2.zip" --subject "$LAUNCHER" --tool-output "$TRUST/macos-x86_64/notarization-tool.txt" --verifier-tool notarytool --verifier-identity accepted --verifier-version 1.0 --output "$TRUST/macos-x86_64/notarization.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind stapling --subject "$ROOT/BaronyModLoader-macos-universal2.zip" --subject "$LAUNCHER" --tool-output "$TRUST/macos-x86_64/stapling-tool.txt" --verifier-tool stapler --verifier-identity validate --verifier-version 1.0 --output "$TRUST/macos-x86_64/stapling.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind quarantine --subject "$ROOT/BaronyModLoader-macos-universal2.zip" --subject "$LAUNCHER" --tool-output "$TRUST/macos-x86_64/quarantine-tool.txt" --verifier-tool spctl --verifier-identity Gatekeeper-assessment --verifier-version 1.0 --output "$TRUST/macos-x86_64/quarantine.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind codeSignature --subject "$ROOT/BaronyModLoader-macos-universal2.zip" --subject "$LAUNCHER" --tool-output "$TRUST/macos-arm64/code-signature-tool.txt" --verifier-tool codesign --verifier-identity designated-requirement --verifier-version 1.0 --output "$TRUST/macos-arm64/code-signature.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind notarization --subject "$ROOT/BaronyModLoader-macos-universal2.zip" --subject "$LAUNCHER" --tool-output "$TRUST/macos-arm64/notarization-tool.txt" --verifier-tool notarytool --verifier-identity accepted --verifier-version 1.0 --output "$TRUST/macos-arm64/notarization.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind stapling --subject "$ROOT/BaronyModLoader-macos-universal2.zip" --subject "$LAUNCHER" --tool-output "$TRUST/macos-arm64/stapling-tool.txt" --verifier-tool stapler --verifier-identity validate --verifier-version 1.0 --output "$TRUST/macos-arm64/stapling.json" || exit 1
          python packaging/release_evidence.py record-proof --release-root "$ROOT" --kind quarantine --subject "$ROOT/BaronyModLoader-macos-universal2.zip" --subject "$LAUNCHER" --tool-output "$TRUST/macos-arm64/quarantine-tool.txt" --verifier-tool spctl --verifier-identity Gatekeeper-assessment --verifier-version 1.0 --output "$TRUST/macos-arm64/quarantine.json" || exit 1
          python - "$ROOT/evidence/platform-trust.json" "$TRUST/code-signature.json" "$TRUST/notarization.json" "$TRUST/stapling.json" "$TRUST/quarantine.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          proofs = [Path(value) for value in sys.argv[2:]]
          if not all(path.is_file() and path.stat().st_size for path in proofs):
              raise SystemExit("platform trust proof is missing")
          output.write_text(json.dumps({"formatVersion": "1.0.0", "status": "verified", "proofs": [{"path": path.name, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()} for path in proofs]}, sort_keys=True) + "\n", encoding="utf-8")
          PY
          cyclonedx-py environment --output-file "$ROOT/BaronyModLoader-macos-universal2.cdx.json" || exit 1
      - id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/release/macos-universal2/BaronyModLoader-macos-universal2.zip
            dist/release/macos-universal2/packages/bml.stash-1.0.0.bmlpkg
            dist/release/macos-universal2/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg
            dist/release/macos-universal2/BaronyModLoader.app/Contents/MacOS/BaronyModLoader
            dist/release/macos-universal2/evidence/trust/code-signature.json
            dist/release/macos-universal2/evidence/trust/notarization.json
            dist/release/macos-universal2/evidence/trust/stapling.json
            dist/release/macos-universal2/evidence/trust/quarantine.json
            dist/release/macos-universal2/evidence/platform-trust.json
            dist/release/macos-universal2/evidence/trust/macos-x86_64/code-signature.json
            dist/release/macos-universal2/evidence/trust/macos-x86_64/notarization.json
            dist/release/macos-universal2/evidence/trust/macos-x86_64/stapling.json
            dist/release/macos-universal2/evidence/trust/macos-x86_64/quarantine.json
            dist/release/macos-universal2/evidence/trust/macos-arm64/code-signature.json
            dist/release/macos-universal2/evidence/trust/macos-arm64/notarization.json
            dist/release/macos-universal2/evidence/trust/macos-arm64/stapling.json
            dist/release/macos-universal2/evidence/trust/macos-arm64/quarantine.json
      - name: Decide advertised macOS target input status and materialize distinct target graphs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=dist/release/macos-universal2
          cp "${{ steps.provenance.outputs.bundle-path }}" "$ROOT/BaronyModLoader-macos-universal2.intoto.jsonl"
          for target in macos-x86_64 macos-arm64; do rm -rf "dist/release/$target"; cp -R "$ROOT" "dist/release/$target"; done
          test -f "dist/release/macos-x86_64/evidence/macos-x86_64/gates/semantic.json" || { echo 'missing macOS x86_64 semantic gate' >&2; exit 1; }
          test -f "dist/release/macos-x86_64/evidence/macos-x86_64/gates/lua.json" || { echo 'missing macOS x86_64 lua gate' >&2; exit 1; }
          test -f "dist/release/macos-x86_64/evidence/macos-x86_64/gates/save.json" || { echo 'missing macOS x86_64 save gate' >&2; exit 1; }
          test -f "dist/release/macos-x86_64/evidence/macos-x86_64/gates/network.json" || { echo 'missing macOS x86_64 network gate' >&2; exit 1; }
          test -f "dist/release/macos-x86_64/evidence/macos-x86_64/gates/platform.json" || { echo 'missing macOS x86_64 platform gate' >&2; exit 1; }
          test -f "dist/release/macos-arm64/evidence/macos-arm64/gates/semantic.json" || { echo 'missing macOS arm64 semantic gate' >&2; exit 1; }
          test -f "dist/release/macos-arm64/evidence/macos-arm64/gates/lua.json" || { echo 'missing macOS arm64 lua gate' >&2; exit 1; }
          test -f "dist/release/macos-arm64/evidence/macos-arm64/gates/save.json" || { echo 'missing macOS arm64 save gate' >&2; exit 1; }
          test -f "dist/release/macos-arm64/evidence/macos-arm64/gates/network.json" || { echo 'missing macOS arm64 network gate' >&2; exit 1; }
          test -f "dist/release/macos-arm64/evidence/macos-arm64/gates/platform.json" || { echo 'missing macOS arm64 platform gate' >&2; exit 1; }
          for target in macos-x86_64 macos-arm64; do
            TARGET_ROOT="dist/release/$target"
            advertised=true
            for evidence in "$TARGET_ROOT/evidence/$target/exact-build.json" "$TARGET_ROOT/evidence/$target/exact-build.json.sha256" "$TARGET_ROOT/package-smoke.json" "$TARGET_ROOT/package-smoke.json.sha256" "$TARGET_ROOT/evidence/gui-smoke.json" "$TARGET_ROOT/evidence/platform-trust.json" "$TARGET_ROOT/BaronyModLoader-macos-universal2.intoto.jsonl" "$TARGET_ROOT/BaronyModLoader-macos-universal2.cdx.json" "$TARGET_ROOT/packages/bml.stash-1.0.0.bmlpkg" "$TARGET_ROOT/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg" "$TARGET_ROOT/BaronyModLoader.app/Contents/Frameworks/libbarony_bml.dylib" "$TARGET_ROOT/BaronyModLoader.app/Contents/MacOS/BaronyModLoader"; do test -f "$evidence" || advertised=false; done
            test "$advertised" = true || { echo "advertised=false: complete $target target evidence is required" >&2; exit 1; }
            printf '{"formatVersion":"1.0.0","target":"%s","advertised":true}\n' "$target" > "$TARGET_ROOT/advertised-status.json"
          done
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: ${{ success() }}
        with:
          name: BaronyModLoader-macos-x86_64
          path: dist/release/macos-x86_64
          if-no-files-found: error
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: ${{ success() }}
        with:
          name: BaronyModLoader-macos-arm64
          path: dist/release/macos-arm64
          if-no-files-found: error

  final-scenario-evidence:
    name: Final-byte public-v1 scenario (${{ matrix.scenario }})
    needs: [linux-package, windows-package, macos-package]
    strategy:
      fail-fast: true
      matrix:
        include:
          - {scenario: platform-local-linux-x86_64, host_target: linux-x86_64, host_os: linux, host_architecture: x86_64}
          - {scenario: platform-local-windows-x86_64, host_target: windows-x86_64, host_os: windows, host_architecture: x86_64}
          - {scenario: platform-local-macos-x86_64, host_target: macos-x86_64, host_os: macos, host_architecture: x86_64}
          - {scenario: platform-local-macos-arm64, host_target: macos-arm64, host_os: macos, host_architecture: arm64}
          - {scenario: host-linux-x86_64-client-windows-x86_64, host_target: linux-x86_64, host_os: linux, host_architecture: x86_64}
          - {scenario: host-linux-x86_64-client-macos-x86_64, host_target: linux-x86_64, host_os: linux, host_architecture: x86_64}
          - {scenario: host-linux-x86_64-client-macos-arm64, host_target: linux-x86_64, host_os: linux, host_architecture: x86_64}
          - {scenario: host-windows-x86_64-client-linux-x86_64, host_target: windows-x86_64, host_os: windows, host_architecture: x86_64}
          - {scenario: host-windows-x86_64-client-macos-x86_64, host_target: windows-x86_64, host_os: windows, host_architecture: x86_64}
          - {scenario: host-windows-x86_64-client-macos-arm64, host_target: windows-x86_64, host_os: windows, host_architecture: x86_64}
          - {scenario: host-macos-x86_64-client-linux-x86_64, host_target: macos-x86_64, host_os: macos, host_architecture: x86_64}
          - {scenario: host-macos-x86_64-client-windows-x86_64, host_target: macos-x86_64, host_os: macos, host_architecture: x86_64}
          - {scenario: host-macos-x86_64-client-macos-arm64, host_target: macos-x86_64, host_os: macos, host_architecture: x86_64}
          - {scenario: host-macos-arm64-client-linux-x86_64, host_target: macos-arm64, host_os: macos, host_architecture: arm64}
          - {scenario: host-macos-arm64-client-windows-x86_64, host_target: macos-arm64, host_os: macos, host_architecture: arm64}
          - {scenario: host-macos-arm64-client-macos-x86_64, host_target: macos-arm64, host_os: macos, host_architecture: arm64}
          - {scenario: save-linux-x86_64-to-windows-x86_64, host_target: linux-x86_64, host_os: linux, host_architecture: x86_64}
          - {scenario: save-linux-x86_64-to-macos-x86_64, host_target: linux-x86_64, host_os: linux, host_architecture: x86_64}
          - {scenario: save-linux-x86_64-to-macos-arm64, host_target: linux-x86_64, host_os: linux, host_architecture: x86_64}
          - {scenario: save-windows-x86_64-to-macos-x86_64, host_target: windows-x86_64, host_os: windows, host_architecture: x86_64}
          - {scenario: save-windows-x86_64-to-macos-arm64, host_target: windows-x86_64, host_os: windows, host_architecture: x86_64}
          - {scenario: save-macos-x86_64-to-macos-arm64, host_target: macos-x86_64, host_os: macos, host_architecture: x86_64}
    runs-on: [self-hosted, licensed-barony, "${{ matrix.host_os }}", "${{ matrix.host_architecture }}", "${{ matrix.host_target }}"]
    permissions:
      actions: read
      contents: read
    env:
      BML_PUBLIC_V1_SCENARIO_DRIVER: ${{ vars.BML_PUBLIC_V1_SCENARIO_DRIVER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BaronyModLoader-linux-x86_64
          path: final-artifacts/linux-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BaronyModLoader-windows-x86_64
          path: final-artifacts/windows-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BaronyModLoader-macos-x86_64
          path: final-artifacts/macos-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BaronyModLoader-macos-arm64
          path: final-artifacts/macos-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-v1-packages
          path: final-artifacts/packages
      - name: Build the exact release identity from canonical package bytes
        shell: python
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "packaging")
          import public_v1_scenarios

          package_paths = (
              Path("final-artifacts/packages/bml.stash-1.0.0.bmlpkg"),
              Path("final-artifacts/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg"),
          )
          bindings = []
          for path, (package_id, version, artifact_id) in zip(package_paths, public_v1_scenarios.PACKAGE_FACTS, strict=True):
              bindings.append({"id": package_id, "version": version, "artifactId": artifact_id, "path": str(path), "sha256": public_v1_scenarios._sha256(path)})
          identity = public_v1_scenarios.build_release_identity(
              repository=os.environ["RELEASE_REPOSITORY"],
              release_tag=os.environ["RELEASE_TAG"],
              commit_sha=os.environ["RELEASE_COMMIT"],
              package_artifacts=bindings,
          )
          public_v1_scenarios._atomic_json(Path("scenario-work/release-identity.json"), identity)
      - name: Execute one repository-owned scenario against all exact final bytes
        run: |
          python packaging/public_v1_scenarios.py validate
          python packaging/public_v1_scenarios.py execute "${{ matrix.scenario }}" --target-artifact linux-x86_64=final-artifacts/linux-x86_64/BaronyModLoader-linux-x86_64.tar.gz --target-artifact windows-x86_64=final-artifacts/windows-x86_64/BaronyModLoader-windows-x86_64.zip --target-artifact macos-x86_64=final-artifacts/macos-x86_64/BaronyModLoader-macos-universal2.zip --target-artifact macos-arm64=final-artifacts/macos-arm64/BaronyModLoader-macos-universal2.zip --package-artifact bml.stash=final-artifacts/packages/bml.stash-1.0.0.bmlpkg --package-artifact jml.runebound-elixirs-warrior=final-artifacts/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg --release-identity scenario-work/release-identity.json --output scenario-work/raw-result.json
          python packaging/public_v1_scenarios.py materialize-scenario-evidence --result scenario-work/raw-result.json --source-root . --release-root evidence --output "evidence/${{ matrix.scenario }}.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: ${{ success() }}
        with:
          name: final-scenario-${{ matrix.scenario }}
          path: |
            evidence/${{ matrix.scenario }}.json
            evidence/scenarios/${{ matrix.scenario }}
          if-no-files-found: error

  consolidate-final-scenario-evidence:
    name: Validate all 22 final-byte scenarios
    needs: [final-scenario-evidence]
    runs-on: [self-hosted, release-builder, linux, x86_64]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: final-scenario-*
          path: staged/scenarios
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BaronyModLoader-linux-x86_64
          path: staged/final-artifacts/linux-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BaronyModLoader-windows-x86_64
          path: staged/final-artifacts/windows-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BaronyModLoader-macos-x86_64
          path: staged/final-artifacts/macos-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BaronyModLoader-macos-arm64
          path: staged/final-artifacts/macos-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-v1-packages
          path: staged/final-artifacts/packages
      - name: Require the exact canonical verified licensed result set
        shell: bash
        run: |
          set -euo pipefail
          python packaging/public_v1_scenarios.py validate
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("packaging/public-v1-scenarios.json").read_text(encoding="utf-8"))
          expected = [scenario["id"] for scenario in catalog["scenarios"]]
          results = sorted(path for path in Path("staged/scenarios").glob("*.json") if path.is_file())
          if len(results) != 22:
              raise SystemExit(f"expected exactly 22 top-level scenario results, got {len(results)}")
          documents = {path.stem: json.loads(path.read_text(encoding="utf-8")) for path in results}
          if set(documents) != set(expected):
              raise SystemExit("final scenario IDs are missing, extra, or duplicated")
          for scenario_id in expected:
              result = documents[scenario_id]
              if result.get("status") != "verified" or result.get("source") != "licensed-self-hosted":
                  raise SystemExit(f"final scenario is not verified licensed evidence: {scenario_id}")
              if result.get("scenario", {}).get("id") != scenario_id:
                  raise SystemExit(f"final scenario source identity mismatch: {scenario_id}")
          PY
          python packaging/public_v1_scenarios.py build-release-identity --repository "${{ github.repository }}" --release-tag "${{ inputs.release_tag }}" --commit-sha "${{ github.sha }}" --package-artifact bml.stash=staged/final-artifacts/packages/bml.stash-1.0.0.bmlpkg --package-artifact jml.runebound-elixirs-warrior=staged/final-artifacts/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg --output staged/release-identity.json
          mkdir -p staged/scenarios/validation
          python packaging/public_v1_scenarios.py validate-complete-evidence-set --result staged/scenarios/platform-local-linux-x86_64.json --result staged/scenarios/platform-local-windows-x86_64.json --result staged/scenarios/platform-local-macos-x86_64.json --result staged/scenarios/platform-local-macos-arm64.json --result staged/scenarios/host-linux-x86_64-client-windows-x86_64.json --result staged/scenarios/host-linux-x86_64-client-macos-x86_64.json --result staged/scenarios/host-linux-x86_64-client-macos-arm64.json --result staged/scenarios/host-windows-x86_64-client-linux-x86_64.json --result staged/scenarios/host-windows-x86_64-client-macos-x86_64.json --result staged/scenarios/host-windows-x86_64-client-macos-arm64.json --result staged/scenarios/host-macos-x86_64-client-linux-x86_64.json --result staged/scenarios/host-macos-x86_64-client-windows-x86_64.json --result staged/scenarios/host-macos-x86_64-client-macos-arm64.json --result staged/scenarios/host-macos-arm64-client-linux-x86_64.json --result staged/scenarios/host-macos-arm64-client-windows-x86_64.json --result staged/scenarios/host-macos-arm64-client-macos-x86_64.json --result staged/scenarios/save-linux-x86_64-to-windows-x86_64.json --result staged/scenarios/save-linux-x86_64-to-macos-x86_64.json --result staged/scenarios/save-linux-x86_64-to-macos-arm64.json --result staged/scenarios/save-windows-x86_64-to-macos-x86_64.json --result staged/scenarios/save-windows-x86_64-to-macos-arm64.json --result staged/scenarios/save-macos-x86_64-to-macos-arm64.json --release-identity staged/release-identity.json --final-artifact linux-x86_64=staged/final-artifacts/linux-x86_64/BaronyModLoader-linux-x86_64.tar.gz --final-artifact windows-x86_64=staged/final-artifacts/windows-x86_64/BaronyModLoader-windows-x86_64.zip --final-artifact macos-x86_64=staged/final-artifacts/macos-x86_64/BaronyModLoader-macos-universal2.zip --final-artifact macos-arm64=staged/final-artifacts/macos-arm64/BaronyModLoader-macos-universal2.zip --package-artifact bml.stash=staged/final-artifacts/packages/bml.stash-1.0.0.bmlpkg --package-artifact jml.runebound-elixirs-warrior=staged/final-artifacts/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg --evidence-root staged/scenarios --output staged/scenarios/validation/complete-set.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: ${{ success() }}
        with:
          name: public-v1-scenario-evidence
          path: staged/scenarios
          if-no-files-found: error

  publish-release:
    name: Publish one globally validated public-v1 release
    needs: [linux-package, windows-package, macos-package, consolidate-final-scenario-evidence]
    if: ${{ inputs.publish }}
    runs-on: [self-hosted, release-builder, linux, x86_64]
    environment: release-publish
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    outputs:
      created-release-id: ${{ steps.create-draft.outputs.release-id }}
    env:
      BML_LINUX_VERIFIER_TOOL: ${{ vars.BML_LINUX_VERIFIER_TOOL }}
      BML_LINUX_VERIFIER_IDENTITY: ${{ vars.BML_LINUX_VERIFIER_IDENTITY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BaronyModLoader-linux-x86_64
          path: staged/linux-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BaronyModLoader-windows-x86_64
          path: staged/windows-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BaronyModLoader-macos-x86_64
          path: staged/macos-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BaronyModLoader-macos-arm64
          path: staged/macos-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-v1-scenario-evidence
          path: staged/scenarios
      - name: Rehash and identity-check every complete downloaded target bundle
        shell: bash
        run: |
          set -euo pipefail
          command -v lipo >/dev/null || exit 1
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$BML_RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$BML_RELEASE_TAG")" = tag
          test "$(git rev-parse "$BML_RELEASE_TAG^{}")" = "$GITHUB_SHA"
          for target in linux-x86_64 windows-x86_64 macos-x86_64 macos-arm64; do
            test -s "staged/$target/advertised-status.json" || exit 1
            test -s "staged/$target/package-smoke.json" || exit 1
            sha256sum --check "staged/$target/package-smoke.json.sha256" || exit 1
          done
          python - "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$BML_RELEASE_TAG" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          repository, commit, tag = sys.argv[1:]
          expected_packages = [("bml.stash", "1.0.0"), ("jml.runebound-elixirs-warrior", "1.0.0")]
          targets = (("linux-x86_64", "linux", "x86_64"), ("windows-x86_64", "windows", "x86_64"), ("macos-x86_64", "macos", "x86_64"), ("macos-arm64", "macos", "arm64"))
          for target, os_name, architecture in targets:
              root = Path("staged") / target
              if json.loads((root / "advertised-status.json").read_text()) != {"formatVersion": "1.0.0", "target": target, "advertised": True}:
                  raise SystemExit(f"incomplete target bundle: {target}")
              exact = json.loads((root / "evidence" / target / "exact-build.json").read_text())
              identity = exact.get("releaseIdentity", {})
              if (exact.get("os"), exact.get("architecture")) != (os_name, architecture) or (identity.get("repository"), identity.get("commitSha"), identity.get("releaseTag")) != (repository, commit, tag):
                  raise SystemExit(f"exact identity mismatch: {target}")
              if [(entry.get("id"), entry.get("version")) for entry in identity.get("packages", [])] != expected_packages:
                  raise SystemExit(f"ordered package identity mismatch: {target}")
              smoke = json.loads((root / "package-smoke.json").read_text())
              archive = root / str(smoke.get("archive", {}).get("path", ""))
              if smoke.get("evidenceKind") != "packageSmoke" or not archive.is_file() or hashlib.sha256(archive.read_bytes()).hexdigest() != smoke["archive"].get("sha256"):
                  raise SystemExit(f"final package smoke mismatch: {target}")
          PY
          python packaging/release_evidence.py validate-exact --input staged/linux-x86_64/evidence/linux-x86_64/exact-build.json --os linux --architecture x86_64 --digest-output staged/linux-x86_64/evidence/linux-x86_64/exact-build.json.sha256 || exit 1
          python packaging/release_evidence.py validate-exact --input staged/windows-x86_64/evidence/windows-x86_64/exact-build.json --os windows --architecture x86_64 --digest-output staged/windows-x86_64/evidence/windows-x86_64/exact-build.json.sha256 || exit 1
          python packaging/release_evidence.py validate-exact --input staged/macos-x86_64/evidence/macos-x86_64/exact-build.json --os macos --architecture x86_64 --digest-output staged/macos-x86_64/evidence/macos-x86_64/exact-build.json.sha256 || exit 1
          python packaging/release_evidence.py validate-exact --input staged/macos-arm64/evidence/macos-arm64/exact-build.json --os macos --architecture arm64 --digest-output staged/macos-arm64/evidence/macos-arm64/exact-build.json.sha256 || exit 1
          PYTHONPATH=packaging python - <<'PY'
          import json
          from pathlib import Path
          import release_evidence
          for target, os_name, architecture in (
              ("windows-x86_64", "windows", "x86_64"),
              ("macos-x86_64", "macos", "x86_64"),
              ("macos-arm64", "macos", "arm64"),
          ):
              readiness_root = Path("staged") / target / "evidence" / target
              exact_path = readiness_root / "exact-build.json"
              exact = json.loads(exact_path.read_text(encoding="utf-8"))
              subject = (exact_path.parent / exact["adapter"]["artifactPath"]).resolve()
              release_evidence.validate_target_readiness(
                  readiness_root / "target-readiness.json",
                  readiness_root,
                  os_name,
                  architecture,
                  subject,
              )
          PY
          find staged/scenarios -maxdepth 1 -name '*.json.sha256' -print0 | xargs -0 -r sha256sum --check
          test "$(find staged/scenarios -maxdepth 1 -name '*.json' -type f | wc -l)" = 22
      - name: Cryptographically replay staged Linux detached signature
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BML_LINUX_VERIFIER_TOOL" && test -n "$BML_LINUX_VERIFIER_IDENTITY" || exit 1
          test -x "$BML_LINUX_VERIFIER_TOOL" || exit 1
          python packaging/release_evidence.py validate-linux-signature --input evidence/linux-detached-signature.json --release-root staged/linux-x86_64 --archive BaronyModLoader-linux-x86_64.tar.gz --appimage BaronyModLoader-linux-x86_64.AppImage --public-key evidence/linux-release.pub --verifier-tool "$BML_LINUX_VERIFIER_TOOL" --verifier-identity "$BML_LINUX_VERIFIER_IDENTITY"
      - name: Cryptographically verify and structurally validate every staged machine receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null || exit 1
          test "$GITHUB_REPOSITORY" = "${{ github.repository }}"
          test "refs/tags/$BML_RELEASE_TAG" = "refs/tags/${{ inputs.release_tag }}"
          test "$GITHUB_SHA" = "${{ github.sha }}"
          verify_bundle() {
            local bundle="$1"
            local repository="$2"
            local workflow="$3"
            local ref="$4"
            local commit_sha="$5"
            shift 5
            test -s "$bundle" || exit 1
            for subject in "$@"; do
              test -s "$subject" || exit 1
              gh attestation verify "$subject" --repo "$repository" --bundle "$bundle" || exit 1
            done
            python - "$bundle" "$repository" "$workflow" "$ref" "$commit_sha" "$@" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "packaging")
          import release_evidence

          bundle, repository, workflow, ref, commit_sha, *subjects = sys.argv[1:]
          expected_predicate_identity = {
              "repository": repository,
              "workflow": workflow,
              "ref": ref,
              "commit-sha": commit_sha,
          }
          try:
              if not all(json.loads(line).get("dsseEnvelope") for line in Path(bundle).read_text(encoding="utf-8").splitlines()):
                  raise ValueError("missing DSSE envelope")
          except (OSError, ValueError, json.JSONDecodeError) as error:
              raise SystemExit(f"invalid retained provenance bundle: {bundle}") from error
          release_evidence.validate_provenance(
              Path(bundle),
              tuple(Path(subject) for subject in subjects),
              repository=expected_predicate_identity["repository"],
              workflow=expected_predicate_identity["workflow"],
              ref=expected_predicate_identity["ref"],
              commit_sha=expected_predicate_identity["commit-sha"],
          )
          PY
          }
          verify_bundle staged/linux-x86_64/BaronyModLoader-linux-x86_64.intoto.jsonl \
            "$GITHUB_REPOSITORY" .github/workflows/package-release.yml "refs/tags/$BML_RELEASE_TAG" "$GITHUB_SHA" \
            staged/linux-x86_64/evidence/trust/archive-smoke.json \
            staged/linux-x86_64/evidence/trust/appimage-smoke.json \
            staged/linux-x86_64/evidence/platform-trust.json \
            staged/linux-x86_64/BaronyModLoader-linux-x86_64.tar.gz \
            staged/linux-x86_64/BaronyModLoader-linux-x86_64.AppImage \
            staged/linux-x86_64/evidence/linux-release.pub \
            staged/linux-x86_64/evidence/linux-release-digests.json \
            staged/linux-x86_64/evidence/linux-release-digests.json.minisig \
            staged/linux-x86_64/evidence/linux-detached-signature.json
          verify_bundle staged/windows-x86_64/BaronyModLoader-windows-x86_64.intoto.jsonl \
            "$GITHUB_REPOSITORY" .github/workflows/package-release.yml "refs/tags/$BML_RELEASE_TAG" "$GITHUB_SHA" \
            staged/windows-x86_64/evidence/trust/authenticode.json \
            staged/windows-x86_64/evidence/trust/timestamp.json \
            staged/windows-x86_64/evidence/trust/antivirus.json \
            staged/windows-x86_64/evidence/platform-trust.json \
            staged/windows-x86_64/BaronyModLoader-windows-x86_64.zip \
            staged/windows-x86_64/BaronyModLoader-windows-x86_64/bml-win-launcher.exe
