          done
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "packaging")
          import release_evidence
          root = Path("staged").resolve()
          archives = {"linux-x86_64": "BaronyModLoader-linux-x86_64.tar.gz", "windows-x86_64": "BaronyModLoader-windows-x86_64.zip", "macos-x86_64": "BaronyModLoader-macos-universal2.zip", "macos-arm64": "BaronyModLoader-macos-universal2.zip"}
