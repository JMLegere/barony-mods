      - id: global-index
        name: Attest one detached global release index
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: staged/release-index.json
      - name: Validate signed global index before publication
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.global-index.outputs.bundle-path }}" staged/release-index.intoto.jsonl
          python packaging/release_evidence.py validate-index --input staged/release-index.json --release-root staged --attestation staged/release-index.intoto.jsonl --repository "${{ github.repository }}" --workflow .github/workflows/package-release.yml --ref "refs/tags/${{ inputs.release_tag }}" --commit-sha "${{ github.sha }}" --linux-public-key evidence/linux-release.pub --linux-verifier-tool "$BML_LINUX_VERIFIER_TOOL" --linux-verifier-identity "$BML_LINUX_VERIFIER_IDENTITY" || exit 1
      - name: Preflight both Workshop items and capture one rollback kit
        shell: bash
        env:
          BML_WORKSHOP_STEAM_BUILD_COMMAND_FILE: ${{ vars.BML_WORKSHOP_STEAM_BUILD_COMMAND_FILE }}
          BML_WORKSHOP_STEAM_DETAILS_COMMAND_FILE: ${{ vars.BML_WORKSHOP_STEAM_DETAILS_COMMAND_FILE }}
          BML_WORKSHOP_STEAM_DOWNLOAD_COMMAND_FILE: ${{ vars.BML_WORKSHOP_STEAM_DOWNLOAD_COMMAND_FILE }}
        run: |
          set -euo pipefail
          umask 077
          authority_root="$RUNNER_TEMP/bml-workshop-authority-preflight"
          rm -rf -- "$authority_root"
          mkdir -m 0700 "$authority_root"
          seal_command_file() {
            local source="$1"
            local destination="$2"
            test -n "$source" && test -f "$source" && test ! -L "$source" || exit 1
            install -m 0400 "$source" "$destination"
            test "$(stat -c '%a' "$destination")" = 400 || exit 1
          }
          bml_workshop_steam_build_command_file="$authority_root/steam-build"
          bml_workshop_steam_details_command_file="$authority_root/steam-details"
          bml_workshop_steam_download_command_file="$authority_root/steam-download"
          seal_command_file "$BML_WORKSHOP_STEAM_BUILD_COMMAND_FILE" "$bml_workshop_steam_build_command_file"
          seal_command_file "$BML_WORKSHOP_STEAM_DETAILS_COMMAND_FILE" "$bml_workshop_steam_details_command_file"
          seal_command_file "$BML_WORKSHOP_STEAM_DOWNLOAD_COMMAND_FILE" "$bml_workshop_steam_download_command_file"
          python packaging/workshop_release.py preflight-public-v1 \
            --candidate-plan staged/workshop/workshop-publication-plan.json \
            --release-root staged \
            --rollback-kit staged/workshop/workshop-rollback-kit.json \
            --steam-build-command-file "$bml_workshop_steam_build_command_file" \
            --steam-details-command-file "$bml_workshop_steam_details_command_file" \
            --steam-download-command-file "$bml_workshop_steam_download_command_file"
      - name: Assemble one portable whole-version recovery archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rm -rf staged/workshop-public-v1-recovery
          mkdir -p \
            staged/workshop-public-v1-recovery/packages \
            staged/workshop-public-v1-recovery/workshop/authority-bound/stash \
            staged/workshop-public-v1-recovery/workshop/authority-bound/warrior \
            staged/workshop-public-v1-recovery/workshop/bml.stash \
            staged/workshop-public-v1-recovery/workshop/jml.runebound-elixirs-warrior
          install -m 0400 staged/workshop/workshop-publication-plan.json staged/workshop-public-v1-recovery/workshop/workshop-publication-plan.json
          install -m 0400 staged/workshop/workshop-rollback-kit.json staged/workshop-public-v1-recovery/workshop/workshop-rollback-kit.json
          install -m 0400 staged/packages/bml.stash-1.0.0.bmlpkg staged/workshop-public-v1-recovery/packages/bml.stash-1.0.0.bmlpkg
          install -m 0400 staged/workshop/authority-bound/stash/workshop.toml staged/workshop-public-v1-recovery/workshop/authority-bound/stash/workshop.toml
          install -m 0400 staged/workshop/bml.stash/preview.png staged/workshop-public-v1-recovery/workshop/bml.stash/preview.png
          install -m 0400 staged/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg staged/workshop-public-v1-recovery/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg
          install -m 0400 staged/workshop/authority-bound/warrior/workshop.toml staged/workshop-public-v1-recovery/workshop/authority-bound/warrior/workshop.toml
          install -m 0400 staged/workshop/jml.runebound-elixirs-warrior/preview.png staged/workshop-public-v1-recovery/workshop/jml.runebound-elixirs-warrior/preview.png
          test ! -e staged/workshop-public-v1-recovery/workshop/bml.stash/workshop.toml
          test ! -e staged/workshop-public-v1-recovery/workshop/jml.runebound-elixirs-warrior/workshop.toml
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf staged/workshop-public-v1-recovery.tar.gz -C staged/workshop-public-v1-recovery packages workshop
      - id: create-draft
        name: Create one asset-free owned draft through the Releases REST API
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$BML_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'refusing to overwrite release' >&2; exit 1; fi
          CREATED_RELEASE_ID=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -F tag_name="$BML_RELEASE_TAG" -F target_commitish="$GITHUB_SHA" -F name="$BML_RELEASE_TAG" -F draft=true -F generate_release_notes=true --jq .id)
          test -n "$CREATED_RELEASE_ID" && test "$CREATED_RELEASE_ID" -gt 0 || { echo 'created release ID is invalid' >&2; exit 1; }
          printf 'release-id=%s\n' "$CREATED_RELEASE_ID" >> "$GITHUB_OUTPUT"
      - id: upload-release-assets
        name: Upload every sealed asset through the exact release ID REST endpoint
        shell: bash
        env:
          OWNED_RELEASE_ID: ${{ steps.create-draft.outputs.release-id }}
        run: |
          set -euo pipefail
          test -n "$OWNED_RELEASE_ID" || { echo 'created release ID is unavailable' >&2; exit 1; }
          CURRENT_RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/$OWNED_RELEASE_ID" --jq .id)
          CURRENT_RELEASE_DRAFT=$(gh api "repos/$GITHUB_REPOSITORY/releases/$OWNED_RELEASE_ID" --jq .draft)
          test "$CURRENT_RELEASE_ID" = "$OWNED_RELEASE_ID" && test "$CURRENT_RELEASE_DRAFT" = true || { echo 'owned draft identity changed before asset upload' >&2; exit 1; }
          ASSETS=(
            staged/BaronyModLoader-linux-x86_64.tar.gz
            staged/BaronyModLoader-linux-x86_64.AppImage
            staged/BaronyModLoader-windows-x86_64.zip
            staged/BaronyModLoader-macos-universal2.zip
            staged/packages/bml.stash-1.0.0.bmlpkg
            staged/packages/jml.runebound-elixirs-warrior-1.0.0.bmlpkg
            staged/BaronyModLoader-linux-x86_64-input-bundle.tar.gz
            staged/BaronyModLoader-windows-x86_64-input-bundle.tar.gz
            staged/BaronyModLoader-macos-x86_64-input-bundle.tar.gz
            staged/BaronyModLoader-macos-arm64-input-bundle.tar.gz
            staged/public-v1-scenario-evidence-bundle.tar.gz
            staged/BaronyModLoader-public-v1.cdx.json
            staged/BaronyModLoader-public-v1.intoto.jsonl
            staged/SHA256SUMS
            staged/release-manifest.schema.json
            staged/release-manifest.json
            staged/release-index.json
            staged/release-index.intoto.jsonl
            staged/evidence/linux-release.pub
            staged/evidence/linux-release-digests.json
            staged/evidence/linux-release-digests.json.minisig
            staged/evidence/linux-detached-signature.json
            staged/workshop/workshop-publication-plan.json
            staged/workshop-public-v1-recovery.tar.gz
          )
          for ASSET in "${ASSETS[@]}"; do
            test -s "$ASSET" || { echo "sealed release asset is missing: $ASSET" >&2; exit 1; }
            ASSET_NAME=$(basename "$ASSET")
            ENCODED_ASSET_NAME=$(python -c 'import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe=""))' "$ASSET_NAME")
            curl --request POST --fail-with-body --show-error --silent --header "Authorization: Bearer $GH_TOKEN" --header "Content-Type: application/octet-stream" --data-binary @$ASSET "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$OWNED_RELEASE_ID/assets?name=$ENCODED_ASSET_NAME" >/dev/null
          done
      - id: publish-atomic-saga
        name: Publish both verified Workshop items and expose GitHub last
        shell: bash
        env:
          OWNED_RELEASE_ID: ${{ steps.create-draft.outputs.release-id }}
          BML_WORKSHOP_STEAM_BUILD_COMMAND_FILE: ${{ vars.BML_WORKSHOP_STEAM_BUILD_COMMAND_FILE }}
          BML_WORKSHOP_STEAM_DETAILS_COMMAND_FILE: ${{ vars.BML_WORKSHOP_STEAM_DETAILS_COMMAND_FILE }}
          BML_WORKSHOP_STEAM_DOWNLOAD_COMMAND_FILE: ${{ vars.BML_WORKSHOP_STEAM_DOWNLOAD_COMMAND_FILE }}
          BML_WORKSHOP_GITHUB_RELEASE_COMMAND_FILE: ${{ vars.BML_WORKSHOP_GITHUB_RELEASE_COMMAND_FILE }}
        run: |
          set -euo pipefail
          for value in OWNED_RELEASE_ID BML_RELEASE_TAG GITHUB_SHA GITHUB_REPOSITORY; do test -n "${!value}" || exit 1; done
          umask 077
          authority_root="$RUNNER_TEMP/bml-workshop-authority-publish"
          rm -rf -- "$authority_root"
          mkdir -m 0700 "$authority_root"
          seal_command_file() {
            local source="$1"
            local destination="$2"
            test -n "$source" && test -f "$source" && test ! -L "$source" || exit 1
            install -m 0400 "$source" "$destination"
            test "$(stat -c '%a' "$destination")" = 400 || exit 1
          }
          owned_release_id="$OWNED_RELEASE_ID"
          bml_release_tag="$BML_RELEASE_TAG"
          github_sha="$GITHUB_SHA"
          github_repository="$GITHUB_REPOSITORY"
          bml_workshop_steam_build_command_file="$authority_root/steam-build"
          bml_workshop_steam_details_command_file="$authority_root/steam-details"
          bml_workshop_steam_download_command_file="$authority_root/steam-download"
          bml_workshop_github_release_command_file="$authority_root/github-release"
          seal_command_file "$BML_WORKSHOP_STEAM_BUILD_COMMAND_FILE" "$bml_workshop_steam_build_command_file"
          seal_command_file "$BML_WORKSHOP_STEAM_DETAILS_COMMAND_FILE" "$bml_workshop_steam_details_command_file"
          seal_command_file "$BML_WORKSHOP_STEAM_DOWNLOAD_COMMAND_FILE" "$bml_workshop_steam_download_command_file"
          seal_command_file "$BML_WORKSHOP_GITHUB_RELEASE_COMMAND_FILE" "$bml_workshop_github_release_command_file"
          python packaging/workshop_release.py publish-public-v1 \
            --candidate-plan staged/workshop/workshop-publication-plan.json \
            --release-root staged \
            --rollback-kit staged/workshop/workshop-rollback-kit.json \
            --github-release-id "$owned_release_id" \
            --release-tag "$bml_release_tag" \
            --commit-sha "$github_sha" \
            --github-repository "$github_repository" \
            --steam-build-command-file "$bml_workshop_steam_build_command_file" \
            --steam-details-command-file "$bml_workshop_steam_details_command_file" \
            --steam-download-command-file "$bml_workshop_steam_download_command_file" \
            --github-release-command-file "$bml_workshop_github_release_command_file"
      - name: Compensate every incomplete Workshop and GitHub publication
        if: ${{ always() && steps.create-draft.outputs.release-id != '' && steps.publish-atomic-saga.outcome != 'success' }}
        shell: bash
        env:
          OWNED_RELEASE_ID: ${{ steps.create-draft.outputs.release-id }}
          BML_WORKSHOP_STEAM_BUILD_COMMAND_FILE: ${{ vars.BML_WORKSHOP_STEAM_BUILD_COMMAND_FILE }}
          BML_WORKSHOP_STEAM_DETAILS_COMMAND_FILE: ${{ vars.BML_WORKSHOP_STEAM_DETAILS_COMMAND_FILE }}
          BML_WORKSHOP_STEAM_DOWNLOAD_COMMAND_FILE: ${{ vars.BML_WORKSHOP_STEAM_DOWNLOAD_COMMAND_FILE }}
          BML_WORKSHOP_GITHUB_RELEASE_COMMAND_FILE: ${{ vars.BML_WORKSHOP_GITHUB_RELEASE_COMMAND_FILE }}
        run: |
          set -euo pipefail
          test -n "$OWNED_RELEASE_ID" || exit 1
          umask 077
          authority_root="$RUNNER_TEMP/bml-workshop-authority-compensate"
          rm -rf -- "$authority_root"
          mkdir -m 0700 "$authority_root"
          seal_command_file() {
            local source="$1"
            local destination="$2"
            test -n "$source" && test -f "$source" && test ! -L "$source" || exit 1
            install -m 0400 "$source" "$destination"
            test "$(stat -c '%a' "$destination")" = 400 || exit 1
          }
          owned_release_id="$OWNED_RELEASE_ID"
          bml_workshop_steam_build_command_file="$authority_root/steam-build"
          bml_workshop_steam_details_command_file="$authority_root/steam-details"
          bml_workshop_steam_download_command_file="$authority_root/steam-download"
          bml_workshop_github_release_command_file="$authority_root/github-release"
          seal_command_file "$BML_WORKSHOP_STEAM_BUILD_COMMAND_FILE" "$bml_workshop_steam_build_command_file"
          seal_command_file "$BML_WORKSHOP_STEAM_DETAILS_COMMAND_FILE" "$bml_workshop_steam_details_command_file"
          seal_command_file "$BML_WORKSHOP_STEAM_DOWNLOAD_COMMAND_FILE" "$bml_workshop_steam_download_command_file"
          seal_command_file "$BML_WORKSHOP_GITHUB_RELEASE_COMMAND_FILE" "$bml_workshop_github_release_command_file"
          python packaging/workshop_release.py compensate-public-v1 \
            --candidate-plan staged/workshop/workshop-publication-plan.json \
            --rollback-kit staged/workshop/workshop-rollback-kit.json \
            --github-release-id "$owned_release_id" \
            --steam-build-command-file "$bml_workshop_steam_build_command_file" \
            --steam-details-command-file "$bml_workshop_steam_details_command_file" \
            --steam-download-command-file "$bml_workshop_steam_download_command_file" \
            --github-release-command-file "$bml_workshop_github_release_command_file"
      - name: Retain private whole-version recovery inputs for final replay failure
        if: ${{ always() && steps.create-draft.outputs.release-id != '' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: workshop-publication-recovery
          path: staged/workshop-public-v1-recovery.tar.gz
          if-no-files-found: error
          retention-days: 1

  verify-public-release:
    name: Replay the public GitHub release graph on Linux
    needs: [publish-release]
    runs-on: [self-hosted, licensed-barony, linux, x86_64]
    permissions:
      contents: read
    env:
      BML_LINUX_VERIFIER_TOOL: ${{ vars.BML_LINUX_VERIFIER_TOOL }}
      BML_LINUX_VERIFIER_IDENTITY: ${{ vars.BML_LINUX_VERIFIER_IDENTITY }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      asset-count: ${{ steps.public-replay.outputs.asset-count }}
      snapshot-sha256: ${{ steps.public-replay.outputs.snapshot-sha256 }}
      release-id: ${{ steps.public-replay.outputs.release-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - id: public-root
        name: Allocate one clean public download root
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_ROOT="$(mktemp -d "$RUNNER_TEMP/bml-public-download.XXXXXX")"
          printf 'PUBLIC_ROOT=%s\n' "$PUBLIC_ROOT" >> "$GITHUB_ENV"
      - id: public-replay
        name: Discover one immutable public release snapshot and download every exact asset
        shell: python
        env:
          EXPECTED_TAG: ${{ inputs.release_tag }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_RELEASE_ID: ${{ needs.publish-release.outputs.created-release-id }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          from urllib.parse import quote, urlparse
          import urllib.request

          expected_declared_assets = {
              "BaronyModLoader-linux-x86_64.tar.gz",
              "BaronyModLoader-linux-x86_64.AppImage",
              "BaronyModLoader-windows-x86_64.zip",
              "BaronyModLoader-macos-universal2.zip",
              "bml.stash-1.0.0.bmlpkg",
              "jml.runebound-elixirs-warrior-1.0.0.bmlpkg",
              "BaronyModLoader-linux-x86_64-input-bundle.tar.gz",
              "BaronyModLoader-windows-x86_64-input-bundle.tar.gz",
              "BaronyModLoader-macos-x86_64-input-bundle.tar.gz",
              "BaronyModLoader-macos-arm64-input-bundle.tar.gz",
              "public-v1-scenario-evidence-bundle.tar.gz",
              "BaronyModLoader-public-v1.cdx.json",
              "BaronyModLoader-public-v1.intoto.jsonl",
              "SHA256SUMS",
              "release-manifest.schema.json",
              "release-manifest.json",
              "release-index.json",
              "release-index.intoto.jsonl",
              "linux-release.pub",
              "linux-release-digests.json",
              "linux-release-digests.json.minisig",
              "linux-detached-signature.json",
              "workshop-publication-plan.json",
              "workshop-public-v1-recovery.tar.gz",
          }
          tag = os.environ["EXPECTED_TAG"]
          repository = os.environ["EXPECTED_REPOSITORY"]
          expected_release_id = int(os.environ["EXPECTED_RELEASE_ID"])
          endpoint = f"https://api.github.com/repos/{repository}/releases/tags/{quote(tag, safe='')}"
          request = urllib.request.Request(endpoint, headers={"Accept": "application/vnd.github+json", "User-Agent": "bml-public-release-verifier"})
          with urllib.request.urlopen(request, timeout=60) as response:
              release = json.load(response)
          release_id = release.get("id")
          if not isinstance(release_id, int) or release_id <= 0:
              raise SystemExit("public Releases API returned an invalid immutable release ID")
          if release_id != expected_release_id:
              raise SystemExit("public Releases API returned a release not created by this workflow run")
          if release.get("draft") is not False:
              raise SystemExit("public Releases API returned a draft release")
          if release.get("tag_name") != tag:
              raise SystemExit("public Releases API returned the wrong tag_name")
          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("public Releases API omitted assets")
          api_assets = {asset.get("name") for asset in assets}
          if None in api_assets or api_assets != expected_declared_assets or len(assets) != len(expected_declared_assets):
              raise SystemExit("public API asset set/count differs from the declared release asset set")
          asset_ids = {asset.get("id") for asset in assets}
          if None in asset_ids or len(asset_ids) != len(assets):
              raise SystemExit("public API asset IDs are missing or duplicated")

          root = Path(os.environ["PUBLIC_ROOT"])
          snapshot_assets = []
          for asset in assets:
              asset_id = asset.get("id")
              name = asset.get("name")
              size = asset.get("size")
              url = asset.get("browser_download_url")
              if not isinstance(asset_id, int) or asset_id <= 0:
                  raise SystemExit(f"asset ID is invalid: {name}")
              if not isinstance(name, str) or name not in expected_declared_assets:
                  raise SystemExit("asset name is invalid")
              if not isinstance(size, int) or size < 0:
                  raise SystemExit(f"asset size is invalid: {name}")
              if not isinstance(url, str) or urlparse(url).scheme != "https":
                  raise SystemExit(f"asset browser_download_url is not public HTTPS: {name}")
              download_request = urllib.request.Request(url, headers={"User-Agent": "bml-public-release-verifier"})
              with urllib.request.urlopen(download_request, timeout=300) as response:
                  if urlparse(response.geturl()).scheme != "https":
                      raise SystemExit(f"asset redirect left HTTPS: {name}")
                  asset_bytes = response.read()
              if len(asset_bytes) != asset.get("size"):
                  raise SystemExit(f"downloaded asset size differs from the release snapshot: {name}")
              (root / name).write_bytes(asset_bytes)
              snapshot_assets.append({
                  "id": asset.get("id"),
                  "name": name,
                  "size": asset.get("size"),
                  "sha256": hashlib.sha256(asset_bytes).hexdigest(),
                  "browserDownloadUrl": url,
              })
          downloaded_assets = {path.name for path in root.iterdir() if path.is_file()}
          if downloaded_assets != expected_declared_assets or len(downloaded_assets) != len(expected_declared_assets):
              raise SystemExit("downloaded public asset set/count is incomplete")

          snapshot_assets = sorted(snapshot_assets, key=lambda asset: asset["name"])
          snapshot = {
              "formatVersion": "1.0.0",
              "evidenceKind": "PublicAssetSnapshot",
              "status": "verified",
              "repository": repository,
              "releaseTag": tag,
              "commitSha": os.environ["EXPECTED_COMMIT"],
              "releaseId": release_id,
              "assets": snapshot_assets,
          }
          snapshot_root = Path("public-verification")
          shutil.rmtree(snapshot_root, ignore_errors=True)
          snapshot_root.mkdir()
          snapshot_path = snapshot_root / "public-asset-snapshot.json"
          snapshot_bytes = (json.dumps(snapshot, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          snapshot_path.write_bytes(snapshot_bytes)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"asset-count={len(downloaded_assets)}\n")
              output.write(f"snapshot-sha256={hashlib.sha256(snapshot_bytes).hexdigest()}\n")
              output.write(f"release-id={release_id}\n")
      - name: Reconstruct the declared graph exclusively from public assets
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import tarfile
          import stat

          root = Path(os.environ["PUBLIC_ROOT"])
          bundles = {
              "linux-x86_64": "BaronyModLoader-linux-x86_64-input-bundle.tar.gz",
              "windows-x86_64": "BaronyModLoader-windows-x86_64-input-bundle.tar.gz",
              "macos-x86_64": "BaronyModLoader-macos-x86_64-input-bundle.tar.gz",
              "macos-arm64": "BaronyModLoader-macos-arm64-input-bundle.tar.gz",
          }
          for target, bundle in bundles.items():
              destination = root / target
              destination.mkdir()
              with tarfile.open(root / bundle, "r:gz") as archive:
                  archive.extractall(destination, filter="data")
          (root / "scenarios").mkdir()
          with tarfile.open(root / "public-v1-scenario-evidence-bundle.tar.gz", "r:gz") as archive:
              archive.extractall(root / "scenarios", filter="data")
          (root / "packages").mkdir()
          for package in ("bml.stash-1.0.0.bmlpkg", "jml.runebound-elixirs-warrior-1.0.0.bmlpkg"):
              shutil.copy2(root / package, root / "packages" / package)
          (root / "workshop").mkdir()
          shutil.copy2(root / "workshop-publication-plan.json", root / "workshop" / "workshop-publication-plan.json")
          recovery = root / "workshop-public-v1-recovery"
          recovery.mkdir()
          with tarfile.open(root / "workshop-public-v1-recovery.tar.gz", "r:gz") as archive:
              archive.extractall(recovery, filter="data")
          recovery_plan = recovery / "workshop" / "workshop-publication-plan.json"
          recovery_rollback = recovery / "workshop" / "workshop-rollback-kit.json"
          for document_path, label in (
              (recovery_plan, "Workshop recovery plan"),
              (recovery_rollback, "Workshop recovery rollback kit"),
          ):
              metadata = document_path.lstat()
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit(f"{label} is not a non-symlink regular file")
          if recovery_plan.read_bytes() != (root / "workshop-publication-plan.json").read_bytes():
              raise SystemExit("portable Workshop recovery plan differs from the sealed public plan")
          plan = json.loads(recovery_plan.read_bytes())
          items = plan.get("items")
          if not isinstance(items, list) or len(items) != 2:
              raise SystemExit("portable Workshop recovery plan has the wrong item set")
          recovery_root = recovery.resolve()
          for item in items:
              if not isinstance(item, dict):
                  raise SystemExit("portable Workshop recovery plan item is invalid")
              for binding_name in ("sealedPackage", "workshopToml", "preview"):
                  binding = item.get(binding_name)
                  if not isinstance(binding, dict) or set(binding) != {"path", "sha256"}:
                      raise SystemExit(f"portable Workshop {binding_name} binding is invalid")
                  path_value = binding.get("path")
                  digest_value = binding.get("sha256")
                  if not isinstance(path_value, str) or not path_value or path_value != path_value.strip():
                      raise SystemExit(f"portable Workshop {binding_name} path is invalid")
                  relative_path = Path(path_value)
                  if relative_path.is_absolute() or ".." in relative_path.parts:
                      raise SystemExit(f"portable Workshop {binding_name} path escapes the recovery root")
                  candidate = recovery / relative_path
                  try:
                      candidate.resolve(strict=True).relative_to(recovery_root)
                  except (OSError, ValueError) as error:
                      raise SystemExit(
                          f"portable Workshop {binding_name} path escapes the recovery root"
                      ) from error
                  component = recovery
                  for part in relative_path.parts:
                      component /= part
                      if stat.S_ISLNK(component.lstat().st_mode):
                          raise SystemExit(f"portable Workshop {binding_name} path uses a symlink")
                  if not stat.S_ISREG(candidate.lstat().st_mode):
                      raise SystemExit(f"portable Workshop {binding_name} is not a regular file")
                  if (
                      not isinstance(digest_value, str)
                      or len(digest_value) != 64
                      or any(character not in "0123456789abcdef" for character in digest_value)
                      or hashlib.sha256(candidate.read_bytes()).hexdigest() != digest_value
                  ):
                      raise SystemExit(f"portable Workshop {binding_name} digest differs from the sealed plan")
          shutil.copy2(root / "linux-x86_64" / "AppDir" / "usr" / "lib" / "libbarony_bml.so", root / "libbarony_bml.so")
          shutil.copy2(root / "linux-x86_64" / "AppDir" / "AppRun", root / "AppRun")
          shutil.copytree(root / "windows-x86_64" / "BaronyModLoader-windows-x86_64", root / "BaronyModLoader-windows-x86_64")
          shutil.copytree(root / "macos-x86_64" / "BaronyModLoader.app", root / "BaronyModLoader.app", symlinks=True)
          evidence = root / "evidence"
          for directory in (
              evidence / "rebased-smoke",
              evidence / "rebased-gui",
              evidence / "trust",
              evidence / "global-trust" / "linux-x86_64",
              evidence / "global-trust" / "windows-x86_64",
              evidence / "global-trust" / "macos-x86_64",
              evidence / "global-trust" / "macos-arm64",
          ):
              directory.mkdir(parents=True, exist_ok=True)
          for name in ("linux-release.pub", "linux-release-digests.json", "linux-release-digests.json.minisig", "linux-detached-signature.json"):
              shutil.copy2(root / name, evidence / name)
          for source in (root / "linux-x86_64" / "evidence" / "trust").glob("*-tool.*"):
              shutil.copy2(source, evidence / "trust" / source.name)
          for name in ("archive-smoke.json", "appimage-smoke.json"):
              shutil.copy2(root / "linux-x86_64" / "evidence" / "trust" / name, evidence / "global-trust" / "linux-x86_64" / name)
          for source in (root / "windows-x86_64" / "evidence" / "trust").glob("*-tool.*"):
              shutil.copy2(source, evidence / "trust" / source.name)
          for name in ("authenticode.json", "timestamp.json", "antivirus.json"):
              shutil.copy2(root / "windows-x86_64" / "evidence" / "trust" / name, evidence / "global-trust" / "windows-x86_64" / name)
          for target in ("macos-x86_64", "macos-arm64"):
              trust_source = root / target / "evidence" / "trust" / target
              trust_destination = evidence / "trust" / target
              trust_destination.mkdir()
              for source in trust_source.glob("*-tool.*"):
                  shutil.copy2(source, trust_destination / source.name)
              for source in trust_source.glob("*.json"):
                  shutil.copy2(source, evidence / "global-trust" / target / source.name)
          archives = {
              "linux-x86_64": "BaronyModLoader-linux-x86_64.tar.gz",
              "windows-x86_64": "BaronyModLoader-windows-x86_64.zip",
              "macos-x86_64": "BaronyModLoader-macos-universal2.zip",
              "macos-arm64": "BaronyModLoader-macos-universal2.zip",
          }
          for target, archive_name in archives.items():
              target_root = root / target
              original = json.loads((target_root / "package-smoke.json").read_text(encoding="utf-8"))
              report = target_root / original["gui"]["reportPath"]
              report_target = evidence / "rebased-gui" / f"{target}.json"
              shutil.copy2(report, report_target)
              original["archive"] = {"path": archive_name, "sha256": hashlib.sha256((root / archive_name).read_bytes()).hexdigest()}
              original["gui"]["reportPath"] = f"evidence/rebased-gui/{target}.json"
              original["gui"]["reportSha256"] = hashlib.sha256(report_target.read_bytes()).hexdigest()
              (evidence / "rebased-smoke" / f"{target}.json").write_text(json.dumps(original, indent=2, sort_keys=True) + "\n", encoding="utf-8")
      - name: Replay checksums manifest target matrix index and Linux signature on public bytes
        shell: bash
        run: |
          set -euo pipefail
          test -x "$BML_LINUX_VERIFIER_TOOL" && test -n "$BML_LINUX_VERIFIER_IDENTITY" || exit 1
          (cd "$PUBLIC_ROOT" && sha256sum --check SHA256SUMS)
          python packaging/release_evidence.py validate-linux-signature --input evidence/linux-detached-signature.json --release-root "$PUBLIC_ROOT" --archive BaronyModLoader-linux-x86_64.tar.gz --appimage BaronyModLoader-linux-x86_64.AppImage --public-key evidence/linux-release.pub --verifier-tool "$BML_LINUX_VERIFIER_TOOL" --verifier-identity "$BML_LINUX_VERIFIER_IDENTITY"
          python packaging/release_evidence.py validate-manifest --input "$PUBLIC_ROOT/release-manifest.json" --release-root "$PUBLIC_ROOT" --provenance-repository "$GITHUB_REPOSITORY" --provenance-workflow .github/workflows/package-release.yml --provenance-ref "refs/tags/$BML_RELEASE_TAG" --commit-sha "$GITHUB_SHA" --linux-public-key evidence/linux-release.pub --linux-verifier-tool "$BML_LINUX_VERIFIER_TOOL" --linux-verifier-identity "$BML_LINUX_VERIFIER_IDENTITY"
          python packaging/release_evidence.py validate-index --input "$PUBLIC_ROOT/release-index.json" --release-root "$PUBLIC_ROOT" --attestation "$PUBLIC_ROOT/release-index.intoto.jsonl" --repository "$GITHUB_REPOSITORY" --workflow .github/workflows/package-release.yml --ref "refs/tags/$BML_RELEASE_TAG" --commit-sha "$GITHUB_SHA" --linux-public-key evidence/linux-release.pub --linux-verifier-tool "$BML_LINUX_VERIFIER_TOOL" --linux-verifier-identity "$BML_LINUX_VERIFIER_IDENTITY"
      - name: Require the exact advertised four-target matrix
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          manifest = json.loads((Path(os.environ["PUBLIC_ROOT"]) / "release-manifest.json").read_text(encoding="utf-8"))
          expected_targets = {
              ("linux", "x86_64"),
              ("windows", "x86_64"),
              ("macos", "x86_64"),
              ("macos", "arm64"),
          }
          actual_targets = {(platform.get("os"), platform.get("architecture")) for platform in manifest.get("platforms", []) if platform.get("advertised") is True}
          if set(actual_targets) != expected_targets:
              raise SystemExit("public manifest advertised target matrix is missing or extra")
      - name: Upload the sealed canonical public asset snapshot
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: public-asset-snapshot
          path: public-verification/public-asset-snapshot.json
          if-no-files-found: error


  verify-public-windows:
    name: Replay Authenticode on the snapshotted public Windows archive
    needs: [verify-public-release]
    runs-on: [self-hosted, licensed-barony, windows, x86_64]
    permissions:
      actions: read
      contents: read
    outputs:
      receipt-sha256: ${{ steps.windows-receipt.outputs.receipt-sha256 }}
    steps:
      - name: Download the canonical public asset snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-asset-snapshot
          path: public-snapshot
      - name: Download and unpack the exact snapshotted public Windows archive
        shell: python
        env:
          EXPECTED_SNAPSHOT_SHA256: ${{ needs.verify-public-release.outputs.snapshot-sha256 }}
          EXPECTED_RELEASE_ID: ${{ needs.verify-public-release.outputs.release-id }}
          EXPECTED_TAG: ${{ inputs.release_tag }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          from urllib.parse import urlparse
          import urllib.request
          import zipfile

          snapshot_path = Path("public-snapshot/public-asset-snapshot.json")
          snapshot_bytes = snapshot_path.read_bytes()
          snapshot_sha256 = hashlib.sha256(snapshot_bytes).hexdigest()
          if snapshot_sha256 != os.environ["EXPECTED_SNAPSHOT_SHA256"]:
              raise SystemExit("Windows replay received a changed public asset snapshot")
          snapshot = json.loads(snapshot_bytes)
          release = {"id": snapshot.get("releaseId")}
          if str(release.get("id")) != os.environ["EXPECTED_RELEASE_ID"]:
              raise SystemExit("Windows replay received a changed GitHub release ID")
          if (snapshot.get("repository"), snapshot.get("releaseTag"), snapshot.get("commitSha")) != (
              os.environ["EXPECTED_REPOSITORY"],
              os.environ["EXPECTED_TAG"],
              os.environ["EXPECTED_COMMIT"],
          ):
              raise SystemExit("Windows replay received a snapshot for another release identity")
          expected_name = "BaronyModLoader-windows-x86_64.zip"
          matches = [asset for asset in snapshot.get("assets", []) if asset.get("name") == expected_name]
          if len(matches) != 1:
              raise SystemExit("snapshot must contain exactly one public Windows archive")
          asset = matches[0]
          if not isinstance(asset.get("id"), int) or asset.get("id") <= 0:
              raise SystemExit("snapshot Windows asset ID is invalid")
          if asset.get("name") != expected_name:
              raise SystemExit("snapshot Windows asset name changed")
          if not isinstance(asset.get("size"), int) or asset.get("size") < 0:
              raise SystemExit("snapshot Windows asset size is invalid")
          if re.fullmatch(r"[0-9a-f]{64}", str(asset.get("sha256"))) is None:
              raise SystemExit("snapshot Windows asset SHA-256 is invalid")
          url = asset.get("browserDownloadUrl")
          if not isinstance(url, str) or urlparse(url).scheme != "https":
              raise SystemExit("snapshotted Windows archive URL is not public HTTPS")

          root = Path(os.environ["RUNNER_TEMP"]) / "bml-public-windows"
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir()
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "bml-public-windows-verifier"}), timeout=300) as response:
              if urlparse(response.geturl()).scheme != "https":
                  raise SystemExit("public Windows asset redirect left HTTPS")
              archive_bytes = response.read()
          archive = root / expected_name
          archive.write_bytes(archive_bytes)
          if len(archive_bytes) != asset.get("size") or archive.stat().st_size != asset.get("size"):
              raise SystemExit("public Windows archive size changed after the snapshot")
          if hashlib.sha256(archive_bytes).hexdigest() != asset.get("sha256"):
              raise SystemExit("public Windows archive SHA-256 changed after the snapshot")
          with zipfile.ZipFile(archive) as package:
              members = [PurePosixPath(name) for name in package.namelist()]
              if any(member.is_absolute() or ".." in member.parts for member in members):
                  raise SystemExit("public Windows archive contains an unsafe path")
              package.extractall(root)
          base = {
              "formatVersion": "1.0.0",
              "evidenceKind": "PublicPlatformVerification",
              "status": "verified",
              "targetIds": ["windows-x86_64"],
              "repository": snapshot["repository"],
              "releaseTag": snapshot["releaseTag"],
              "commitSha": snapshot["commitSha"],
              "releaseId": release.get("id"),
              "assetSnapshotSha256": snapshot_sha256,
              "asset": asset,
          }
          Path("public-windows-verification-base.json").write_text(json.dumps(base, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"PUBLIC_WINDOWS_ROOT={root}\n")
      - name: Verify Authenticode and timestamp on snapshotted public bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Launcher = Join-Path $env:PUBLIC_WINDOWS_ROOT 'BaronyModLoader-windows-x86_64/bml-win-launcher.exe'
          & signtool verify /pa /v $Launcher
          if ($LASTEXITCODE -ne 0) { throw 'public Authenticode verification failed' }
          & signtool verify /pa /all /v $Launcher
          if ($LASTEXITCODE -ne 0) { throw 'public Authenticode timestamp verification failed' }
      - id: windows-receipt
        name: Seal the Windows public-byte receipt
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path("public-windows-verification-base.json").read_text(encoding="utf-8"))
          receipt["nativeChecks"] = {"authenticode": "verified", "timestamp": "verified"}
          receipt_path = Path("public-windows-verification.json")
          receipt_bytes = (json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          receipt_path.write_bytes(receipt_bytes)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"receipt-sha256={hashlib.sha256(receipt_bytes).hexdigest()}\n")
      - name: Upload the canonical Windows native receipt
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: public-windows-verification
          path: public-windows-verification.json
          if-no-files-found: error

  verify-public-macos:
    name: Replay Apple trust on the snapshotted public macOS archive
    needs: [verify-public-release]
    runs-on: [self-hosted, licensed-barony, macos, universal2]
    environment: release-signing
    permissions:
      actions: read
      contents: read
    env:
      BML_APPLE_ID: ${{ secrets.BML_APPLE_ID }}
      BML_APPLE_TEAM_ID: ${{ secrets.BML_APPLE_TEAM_ID }}
      BML_APPLE_APP_PASSWORD: ${{ secrets.BML_APPLE_APP_PASSWORD }}
    outputs:
      receipt-sha256: ${{ steps.macos-receipt.outputs.receipt-sha256 }}
    steps:
      - name: Download the canonical public asset snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-asset-snapshot
          path: public-snapshot
      - name: Download the exact snapshotted public macOS archive
        shell: python
        env:
          EXPECTED_SNAPSHOT_SHA256: ${{ needs.verify-public-release.outputs.snapshot-sha256 }}
          EXPECTED_RELEASE_ID: ${{ needs.verify-public-release.outputs.release-id }}
          EXPECTED_TAG: ${{ inputs.release_tag }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          from urllib.parse import urlparse
          import urllib.request

          snapshot_path = Path("public-snapshot/public-asset-snapshot.json")
          snapshot_bytes = snapshot_path.read_bytes()
          snapshot_sha256 = hashlib.sha256(snapshot_bytes).hexdigest()
          if snapshot_sha256 != os.environ["EXPECTED_SNAPSHOT_SHA256"]:
              raise SystemExit("macOS replay received a changed public asset snapshot")
          snapshot = json.loads(snapshot_bytes)
          release = {"id": snapshot.get("releaseId")}
          if str(release.get("id")) != os.environ["EXPECTED_RELEASE_ID"]:
              raise SystemExit("macOS replay received a changed GitHub release ID")
          if (snapshot.get("repository"), snapshot.get("releaseTag"), snapshot.get("commitSha")) != (
              os.environ["EXPECTED_REPOSITORY"],
              os.environ["EXPECTED_TAG"],
              os.environ["EXPECTED_COMMIT"],
          ):
              raise SystemExit("macOS replay received a snapshot for another release identity")
          expected_name = "BaronyModLoader-macos-universal2.zip"
          matches = [asset for asset in snapshot.get("assets", []) if asset.get("name") == expected_name]
          if len(matches) != 1:
              raise SystemExit("snapshot must contain exactly one public macOS archive")
          asset = matches[0]
          if not isinstance(asset.get("id"), int) or asset.get("id") <= 0:
              raise SystemExit("snapshot macOS asset ID is invalid")
          if asset.get("name") != expected_name:
              raise SystemExit("snapshot macOS asset name changed")
          if not isinstance(asset.get("size"), int) or asset.get("size") < 0:
              raise SystemExit("snapshot macOS asset size is invalid")
          if re.fullmatch(r"[0-9a-f]{64}", str(asset.get("sha256"))) is None:
              raise SystemExit("snapshot macOS asset SHA-256 is invalid")
          url = asset.get("browserDownloadUrl")
          if not isinstance(url, str) or urlparse(url).scheme != "https":
              raise SystemExit("snapshotted macOS archive URL is not public HTTPS")

          root = Path(os.environ["RUNNER_TEMP"]) / "bml-public-macos"
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir()
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "bml-public-macos-verifier"}), timeout=300) as response:
              if urlparse(response.geturl()).scheme != "https":
                  raise SystemExit("public macOS asset redirect left HTTPS")
              archive_bytes = response.read()
          archive = root / expected_name
          archive.write_bytes(archive_bytes)
          if len(archive_bytes) != asset.get("size") or archive.stat().st_size != asset.get("size"):
              raise SystemExit("public macOS archive size changed after the snapshot")
          if hashlib.sha256(archive_bytes).hexdigest() != asset.get("sha256"):
              raise SystemExit("public macOS archive SHA-256 changed after the snapshot")
          base = {
              "formatVersion": "1.0.0",
              "evidenceKind": "PublicPlatformVerification",
              "status": "verified",
              "targetIds": ["macos-arm64", "macos-x86_64"],
              "repository": snapshot["repository"],
              "releaseTag": snapshot["releaseTag"],
              "commitSha": snapshot["commitSha"],
              "releaseId": release.get("id"),
              "assetSnapshotSha256": snapshot_sha256,
              "asset": asset,
          }
          Path("public-macos-verification-base.json").write_text(json.dumps(base, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"PUBLIC_MACOS_ROOT={root}\n")
      - name: Extract with native metadata preservation and verify Apple trust
        shell: bash
        run: |
          set -euo pipefail
          for value in BML_APPLE_ID BML_APPLE_TEAM_ID BML_APPLE_APP_PASSWORD; do test -n "${!value}" || exit 1; done
          EXTRACTED="$PUBLIC_MACOS_ROOT/extracted"
          rm -rf "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          /usr/bin/ditto -x -k "$PUBLIC_MACOS_ROOT/BaronyModLoader-macos-universal2.zip" "$EXTRACTED"
          APP="$EXTRACTED/BaronyModLoader.app"
          codesign --verify --deep --strict --verbose=4 "$APP"
          xcrun notarytool history --apple-id "$BML_APPLE_ID" --team-id "$BML_APPLE_TEAM_ID" --password "$BML_APPLE_APP_PASSWORD"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate -v "$APP"
      - id: macos-receipt
        name: Seal the macOS public-byte receipt
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path("public-macos-verification-base.json").read_text(encoding="utf-8"))
          receipt["nativeChecks"] = {"codeSignature": "verified", "notarization": "verified", "stapling": "verified"}
          receipt_path = Path("public-macos-verification.json")
          receipt_bytes = (json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          receipt_path.write_bytes(receipt_bytes)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"receipt-sha256={hashlib.sha256(receipt_bytes).hexdigest()}\n")
      - name: Upload the canonical macOS native receipt
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: public-macos-verification
          path: public-macos-verification.json
          if-no-files-found: error

  finalize-public-verification:
    name: Seal one public download verification receipt
    needs: [verify-public-release, verify-public-windows, verify-public-macos]
    runs-on: [self-hosted, release-builder, linux, x86_64]
    permissions:
      actions: read
      contents: read
    outputs:
      receipt-sha256: ${{ steps.final-receipt.outputs.receipt-sha256 }}
    steps:
      - name: Download the canonical public asset snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-asset-snapshot
          path: public-verification-input/snapshot
      - name: Download the Windows native receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-windows-verification
          path: public-verification-input/windows
      - name: Download the macOS native receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-macos-verification
          path: public-verification-input/macos
      - id: final-receipt
        name: Write the canonical public verification receipt
        shell: python
        env:
          EXPECTED_SNAPSHOT_SHA256: ${{ needs.verify-public-release.outputs.snapshot-sha256 }}
          EXPECTED_WINDOWS_RECEIPT_SHA256: ${{ needs.verify-public-windows.outputs.receipt-sha256 }}
          EXPECTED_MACOS_RECEIPT_SHA256: ${{ needs.verify-public-macos.outputs.receipt-sha256 }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          def load_canonical(path, expected_sha256):
              payload = path.read_bytes()
              observed_sha256 = hashlib.sha256(payload).hexdigest()
              if observed_sha256 != expected_sha256:
                  raise SystemExit(f"public verification input digest mismatch: {path}")
              document = json.loads(payload)
              canonical = (json.dumps(document, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
              if payload != canonical:
                  raise SystemExit(f"public verification input is not canonical JSON: {path}")
              return document, observed_sha256

          snapshot, snapshot_sha256 = load_canonical(
              Path("public-verification-input/snapshot/public-asset-snapshot.json"),
              os.environ["EXPECTED_SNAPSHOT_SHA256"],
          )
          expected_identity = (
              os.environ["EXPECTED_REPOSITORY"],
              os.environ["EXPECTED_TAG"],
              os.environ["EXPECTED_COMMIT"],
          )
          if (snapshot.get("repository"), snapshot.get("releaseTag"), snapshot.get("commitSha")) != expected_identity:
              raise SystemExit("canonical public snapshot release identity changed")
          if snapshot.get("status") != "verified" or not isinstance(snapshot.get("releaseId"), int):
              raise SystemExit("canonical public snapshot is not verified")
          assets = snapshot.get("assets")
          if not isinstance(assets, list) or not assets:
              raise SystemExit("canonical public snapshot has no exact assets")

          windows, windows_sha256 = load_canonical(
              Path("public-verification-input/windows/public-windows-verification.json"),
              os.environ["EXPECTED_WINDOWS_RECEIPT_SHA256"],
          )
          macos, macos_sha256 = load_canonical(
              Path("public-verification-input/macos/public-macos-verification.json"),
              os.environ["EXPECTED_MACOS_RECEIPT_SHA256"],
          )
          expected_receipts = (
              (windows, ["windows-x86_64"], {"authenticode": "verified", "timestamp": "verified"}),
              (macos, ["macos-arm64", "macos-x86_64"], {"codeSignature": "verified", "notarization": "verified", "stapling": "verified"}),
          )
          for platform_receipt, target_ids, native_checks in expected_receipts:
              if platform_receipt.get("status") != "verified":
                  raise SystemExit("native public verification receipt is not verified")
              if platform_receipt.get("targetIds") != target_ids or platform_receipt.get("nativeChecks") != native_checks:
                  raise SystemExit("native public verification target or checks changed")
              if (platform_receipt.get("repository"), platform_receipt.get("releaseTag"), platform_receipt.get("commitSha")) != expected_identity:
                  raise SystemExit("native public verification release identity changed")
              if platform_receipt.get("releaseId") != snapshot.get("releaseId"):
                  raise SystemExit("native public verification release ID changed")
              if platform_receipt.get("assetSnapshotSha256") != snapshot_sha256:
                  raise SystemExit("native public verification snapshot digest changed")
              if platform_receipt.get("asset") not in assets:
                  raise SystemExit("native public verification asset identity is not in the canonical snapshot")

          receipt = {
              "formatVersion": "1.0.0",
              "evidenceKind": "PublicDownloadVerification",
              "status": "verified",
              "repository": snapshot["repository"],
              "releaseTag": snapshot["releaseTag"],
              "commitSha": snapshot["commitSha"],
              "releaseId": snapshot["releaseId"],
              "assetCount": len(assets),
              "assetSnapshotSha256": snapshot_sha256,
              "assets": assets,
              "platformReceipts": [
                  {"targetIds": ["macos-arm64", "macos-x86_64"], "receiptSha256": macos_sha256},
                  {"targetIds": ["windows-x86_64"], "receiptSha256": windows_sha256},
              ],
          }
          receipt_path = Path("public-download-verification.json")
          receipt_bytes = (json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          receipt_path.write_bytes(receipt_bytes)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"receipt-sha256={hashlib.sha256(receipt_bytes).hexdigest()}\n")
      - name: Upload the one typed public download verification receipt
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: public-download-verification
          path: public-download-verification.json
          if-no-files-found: error

  withdraw-failed-public-release:
    name: Withdraw the whole version after any unsafe publication or replay result
    needs: [publish-release, verify-public-release, verify-public-windows, verify-public-macos, finalize-public-verification]
    if: ${{ always() && needs.publish-release.outputs.created-release-id != '' && (cancelled() || failure() || needs.publish-release.result != 'success' || needs.verify-public-release.result != 'success' || needs.verify-public-windows.result != 'success' || needs.verify-public-macos.result != 'success' || needs.finalize-public-verification.result != 'success') }}
    runs-on: [self-hosted, release-builder, linux, x86_64]
    environment: release-publish
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Download the private whole-version recovery inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: workshop-publication-recovery
          path: staged
      - name: Reconstruct the portable whole-version recovery hierarchy
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import tarfile

          recovery = Path("staged/workshop-public-v1-recovery")
          shutil.rmtree(recovery, ignore_errors=True)
          recovery.mkdir()
          with tarfile.open("staged/workshop-public-v1-recovery.tar.gz", "r:gz") as archive:
              archive.extractall(recovery, filter="data")
      - name: Compensate Workshop and GitHub after any failed final replay
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNED_RELEASE_ID: ${{ needs.publish-release.outputs.created-release-id }}
          BML_WORKSHOP_STEAM_BUILD_COMMAND_FILE: ${{ vars.BML_WORKSHOP_STEAM_BUILD_COMMAND_FILE }}
          BML_WORKSHOP_STEAM_DETAILS_COMMAND_FILE: ${{ vars.BML_WORKSHOP_STEAM_DETAILS_COMMAND_FILE }}
          BML_WORKSHOP_STEAM_DOWNLOAD_COMMAND_FILE: ${{ vars.BML_WORKSHOP_STEAM_DOWNLOAD_COMMAND_FILE }}
          BML_WORKSHOP_GITHUB_RELEASE_COMMAND_FILE: ${{ vars.BML_WORKSHOP_GITHUB_RELEASE_COMMAND_FILE }}
        run: |
          set -euo pipefail
          test -n "$OWNED_RELEASE_ID" || exit 1
          umask 077
          authority_root="$RUNNER_TEMP/bml-workshop-authority-final-compensate"
          rm -rf -- "$authority_root"
          mkdir -m 0700 "$authority_root"
          seal_command_file() {
            local source="$1"
            local destination="$2"
            test -n "$source" && test -f "$source" && test ! -L "$source" || exit 1
            install -m 0400 "$source" "$destination"
            test "$(stat -c '%a' "$destination")" = 400 || exit 1
          }
          owned_release_id="$OWNED_RELEASE_ID"
          bml_workshop_steam_build_command_file="$authority_root/steam-build"
          bml_workshop_steam_details_command_file="$authority_root/steam-details"
          bml_workshop_steam_download_command_file="$authority_root/steam-download"
          bml_workshop_github_release_command_file="$authority_root/github-release"
          seal_command_file "$BML_WORKSHOP_STEAM_BUILD_COMMAND_FILE" "$bml_workshop_steam_build_command_file"
          seal_command_file "$BML_WORKSHOP_STEAM_DETAILS_COMMAND_FILE" "$bml_workshop_steam_details_command_file"
          seal_command_file "$BML_WORKSHOP_STEAM_DOWNLOAD_COMMAND_FILE" "$bml_workshop_steam_download_command_file"
          seal_command_file "$BML_WORKSHOP_GITHUB_RELEASE_COMMAND_FILE" "$bml_workshop_github_release_command_file"
          python packaging/workshop_release.py compensate-public-v1 \
            --candidate-plan staged/workshop-public-v1-recovery/workshop/workshop-publication-plan.json \
            --rollback-kit staged/workshop-public-v1-recovery/workshop/workshop-rollback-kit.json \
            --github-release-id "$owned_release_id" \
            --steam-build-command-file "$bml_workshop_steam_build_command_file" \
            --steam-details-command-file "$bml_workshop_steam_details_command_file" \
            --steam-download-command-file "$bml_workshop_steam_download_command_file" \
            --github-release-command-file "$bml_workshop_github_release_command_file"
