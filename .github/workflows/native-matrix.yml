name: Native synthetic matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BML_HOST_MODE: synthetic
  BML_EVIDENCE_MODE: synthetic
  BML_FIXTURE_ROOT: framework/BaronyModLoader/tests/fixtures

jobs:
  native-fixtures:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            test: tests/test_linux_exact_adapter.py
          - runner: windows-2025
            test: tests/test_windows_adapter.py
          - runner: macos-15
            test: tests/test_macos_exact_adapter.py
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run fixture-backed adapter contract
        working-directory: framework/BaronyModLoader
        run: python ${{ matrix.test }}
