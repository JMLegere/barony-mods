name: Application fixture tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BML_HOST_MODE: synthetic
  BML_EVIDENCE_MODE: synthetic
  PYTHONHASHSEED: "0"
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  app-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Validate tracked loader security contracts
        working-directory: framework/BaronyModLoader
        run: python tests/test_loader_security.py
      - name: Exercise tracked target-readiness receipt contract
        working-directory: framework/BaronyModLoader
        run: python tests/test_target_readiness_receipt.py
