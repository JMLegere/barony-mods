name: Application syntax and release-input validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BML_HOST_MODE: synthetic
  BML_EVIDENCE_MODE: synthetic
  PYTHONHASHSEED: "0"
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  app-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile the tracked application entry point
        run: python -m py_compile framework/BaronyModLoader/app/barony_mod_loader.py
      - name: Validate tracked Stash package input
        run: python tools/barony_mods.py validate stash
      - name: Validate tracked Runebound Elixirs package input
        run: python tools/barony_mods.py validate runebound-elixirs
