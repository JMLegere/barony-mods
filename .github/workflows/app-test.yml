name: Application fixture tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BML_HOST_MODE: synthetic
  BML_EVIDENCE_MODE: synthetic
  PYTHONHASHSEED: "0"
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  app-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Validate public fixture schemas
        run: python -m unittest framework.BaronyModLoader.tests.test_public_schemas
      - name: Exercise application fixture contracts
        run: python -m unittest framework.BaronyModLoader.tests.test_release_packaging
