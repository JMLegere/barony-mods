[[scenarios]]
id = "multiplayer_mismatch_rejected_before_divergence"
requirement = "A multiplayer/client Stash state mismatch is rejected before host/client inventory divergence can occur."
verification_layer = "historical_source_patch_behavioral"
setup = [
  "Use two disposable profiles: host profile H with Stash manifest jml.stash@0.1.0 and client profile C with an intentionally mismatched manifest.",
  "Create mismatch variants one at a time: missing jml.stash package, different package version, different runtime contract version, and different inventory schema version.",
  "Preload host Stash with one marker item so divergence would be visible if an incompatible client joined.",
]
commands_and_observations = [
  "HISTORICAL ONLY: $BARONY_BIN --bml-runtime-manifest $HOST_BML_MANIFEST",
  "HISTORICAL ONLY: $BARONY_BIN --bml-runtime-manifest $CLIENT_MISMATCHED_BML_MANIFEST",
  "Start a multiplayer host with profile H, then attempt to join with profile C for each mismatch variant.",
  "Observe the client is rejected during compatibility/handshake before gameplay inventory sync or chest interaction is allowed.",
  "After each rejected attempt, reopen host Stash and verify the marker item remains exactly once and host state snapshot checksum is unchanged.",
]
pass_criteria = [
  "Every mismatch variant is rejected before the client enters gameplay or receives authority to mutate void_chest_inventory.",
  "Host and client both record a clear compatibility failure reason including the mismatched field.",
  "Host Stash state is byte-for-byte unchanged by each rejected client attempt or logically identical if timestamps are expected to differ.",
]
fail_criteria = [
  "An incompatible client reaches gameplay with Stash enabled.",
  "An incompatible client can open, sync, or mutate void_chest_inventory before rejection.",
  "The host Stash state changes after a rejected join attempt.",
  "The rejection reason is missing or ambiguous enough that operators cannot identify the mismatch.",
]
evidence_artifacts = [
  "$EVIDENCE_DIR/multiplayer/host-runtime-manifest.json",
  "$EVIDENCE_DIR/multiplayer/client-missing-stash-manifest.json",
  "$EVIDENCE_DIR/multiplayer/client-version-mismatch-manifest.json",
  "$EVIDENCE_DIR/multiplayer/client-schema-mismatch-manifest.json",
  "$EVIDENCE_DIR/multiplayer/host-log.jsonl",
  "$EVIDENCE_DIR/multiplayer/client-log.jsonl",
  "$EVIDENCE_DIR/multiplayer/host-stash-before.json",
  "$EVIDENCE_DIR/multiplayer/host-stash-after-rejections.json",
]

[[scenarios]]
id = "disable_stash_removes_behavior_without_leftovers"
