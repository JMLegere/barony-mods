  "$EVIDENCE_DIR/runtime-manifest.stash.json",
  "$EVIDENCE_DIR/runtime-load-report.accepted.json",
  "$EVIDENCE_DIR/startup-log.accepted.txt",
  "$EVIDENCE_DIR/title-menu-after-manifest.png",
]

[[scenarios]]
id = "item_persists_death_new_run_relaunch"
requirement = "An item stored through a Stash Void Chest access point persists across death, starting a new run, and closing/relaunching the process."
verification_layer = "historical_source_patch_behavioral"
setup = [
  "Use a fresh disposable BML profile and a fresh save slot.",
  "Enable Stash with the generated runtime manifest.",
  "Choose a unique verification item or stack that is easy to identify by type/count/status in logs and screenshots.",
]
commands_and_observations = [
  "HISTORICAL ONLY: $BARONY_BIN --bml-runtime-manifest $BML_MANIFEST",
  "Start a run, obtain the unique verification item, open a Stash-bound Void Chest, deposit the item, and close the chest.",
  "Capture a screenshot of the chest after deposit and copy the persisted stash state snapshot to $EVIDENCE_DIR/stash-after-deposit.json.",
  "Die or intentionally end the run through normal gameplay, return to a new run using the same profile, open any Stash Void Chest access point, and observe the same item is present once.",
  "Exit the game completely, relaunch with the same manifest/profile, open a Stash Void Chest access point again, and observe the same item is still present once.",
]
pass_criteria = [
  "The deposited item is absent from player inventory after deposit and present in void_chest_inventory after close.",
  "After death and a new run, the same item appears exactly once in the Stash inventory.",
  "After process relaunch, the same item appears exactly once in the Stash inventory.",
  "Persisted item fields needed by Barony item identity are preserved: type, status, beatitude, count, appearance, identified state, owner, and metadata when present.",
]
fail_criteria = [
  "The item is lost after death, new run, or relaunch.",
  "The item duplicates after any transition.",
  "The item remains in player inventory after a successful deposit.",
  "Persisted item state is corrupted or normalized incorrectly.",
]
evidence_artifacts = [
  "$EVIDENCE_DIR/stash-after-deposit.json",
  "$EVIDENCE_DIR/stash-after-death-new-run.json",
  "$EVIDENCE_DIR/stash-after-relaunch.json",
