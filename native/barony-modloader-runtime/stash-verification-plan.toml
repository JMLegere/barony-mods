]

[[scenarios]]
id = "save_resume_no_fork_or_duplicate"
requirement = "Saving and resuming a game keeps one authoritative Stash inventory and does not fork or duplicate entries."
verification_layer = "historical_source_patch_behavioral"
setup = [
  "Use a fresh disposable BML profile and a fresh save slot with Stash enabled.",
  "Deposit two distinct verification items into a Stash Void Chest, close the chest, and copy the persisted state snapshot.",
]
commands_and_observations = [
  "HISTORICAL ONLY: $BARONY_BIN --bml-runtime-manifest $BML_MANIFEST",
  "Deposit item A and item B into Stash, close the chest, save the game through normal Barony save flow, and exit to menu or process.",
  "Resume the saved game with the same profile and manifest.",
  "Open a Stash Void Chest access point, remove item A, close the chest, save, exit, and resume again.",
  "Open a Stash Void Chest access point and observe item B remains exactly once and item A is absent unless it is in the player inventory exactly once.",
]
pass_criteria = [
  "Only one authoritative void_chest_inventory state is loaded on resume.",
  "Item counts after resume match the last closed Stash state, not an older save snapshot plus a newer profile snapshot.",
  "Removing an item after resume updates the same persisted inventory and does not resurrect the item on the next resume.",
]
fail_criteria = [
  "The resumed save shows a forked older inventory instead of the latest closed Stash state.",
  "Any deposited item appears both in Stash and player inventory without player action.",
  "Any deposited item appears more than once after save/resume.",
  "The save file and profile state alternately overwrite each other across resumes.",
]
evidence_artifacts = [
  "$EVIDENCE_DIR/stash-before-save.json",
  "$EVIDENCE_DIR/stash-after-first-resume.json",
  "$EVIDENCE_DIR/stash-after-remove-and-save.json",
  "$EVIDENCE_DIR/stash-after-second-resume.json",
  "$EVIDENCE_DIR/save-resume-screenshots/",
  "$EVIDENCE_DIR/stash-events.save-resume.jsonl",
]

