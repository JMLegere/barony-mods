[[capability]]
id = "persistent_storage"
purpose = "Persist the Stash payload across runs using Barony save/load surfaces and explicit compatibility metadata."

[[capability]]
id = "persistent_inventory"
purpose = "Keep the shared Stash contents as item inventory data, reusing Barony item serialization and list ownership rules."

[[capability]]
id = "void_chest_binding"
purpose = "Route all Void Chest access paths to the same Stash inventory while preserving vanilla Void Chest affordances."

[[capability]]
id = "placement_lobby"
purpose = "Add deterministic permanent purple Void Chest Stash access in the lobby assist area."

[[capability]]
id = "placement_shop"
purpose = "Add deterministic permanent purple Void Chest Stash access to every generated shop."

[[capability]]
id = "multiplayer_version_metadata"
purpose = "Keep Stash saves compatible and server-authoritative in multiplayer/versioned save cases."

[[runtime_source_map]]
name = "void_chest_inventory_declaration_save_load"
capability_ids = ["persistent_storage", "persistent_inventory", "multiplayer_version_metadata"]
source_files = [
  "src/stat.hpp:466",
  "src/scores.hpp:675-707",
  "src/scores.cpp:5922-5937",
  "src/scores.cpp:6615-6627",
]
observed_behavior = "Stat declares list_t void_chest_inventory; SaveGameInfo::Player::stat_t declares and serializes a void_chest_inventory item vector; save code copies each stats[c]->void_chest_inventory item into that vector; load code reconstructs items into stats[statsPlayer]->void_chest_inventory."
intended_p3_change = "Treat the existing void_chest_inventory serialization shape as the Stash payload boundary, persist the shared Stash through save/load, and add explicit metadata/version handling so P3 Stash data can be distinguished from absent or legacy data."
risks = [
  "Vanilla storage is player-stat scoped; a shared Stash must choose one authoritative inventory source and avoid duplicating or losing items across players.",
  "Item ownership must remain compatible with Barony list_t/newItem lifecycle during save/load reconstruction.",
  "Metadata that is mandatory on load could reject older saves; metadata that is absent on save could make P3 Stash state indistinguishable from vanilla void_chest_inventory state.",
]
verification_evidence = [
  "Read /tmp/barony-src/src/stat.hpp:466: list_t void_chest_inventory is declared on Stat.",
  "Read /tmp/barony-src/src/scores.hpp:675-707: SaveGameInfo::Player::stat_t includes std::vector<item_t> void_chest_inventory and serializes property \"void_chest_inventory\".",
  "Read /tmp/barony-src/src/scores.cpp:5922-5937: save path iterates stats[c]->void_chest_inventory and pushes serialized item_t records.",
  "Read /tmp/barony-src/src/scores.cpp:6615-6627: load path creates newItem entries in stats[statsPlayer]->void_chest_inventory.",
]

[[runtime_source_map]]
name = "void_chest_inventory_binding_getter_add_item"
capability_ids = ["void_chest_binding", "persistent_inventory"]
source_files = [
  "src/actchest.cpp:1705-1716",
  "src/actchest.cpp:1773-1785",
  "src/actchest.cpp:817-843",
  "src/actchest.cpp:1015-1027",
]
observed_behavior = "Entity::getChestInventoryList returns nullptr on clients, then for actChest entities with chestVoidState != 0 returns &stats[0]->void_chest_inventory; Entity::addItemToVoidChestServer separately writes to &stats[0]->void_chest_inventory; the purple chest/lid sprites are driven by chestVoidState; positive chestVoidState counts down and expires when not held open."
intended_p3_change = "Redirect both getter and server add-item sites to the same persistent Stash inventory source, keep the purple Void Chest sprite state for Stash access, and restrict timer changes to permanent P3 placements rather than all temporary Void Chest behavior."
risks = [
  "Changing only the getter or only the add-item site would split read/write inventory state and could drop items.",
  "Client-side getter behavior currently returns nullptr; Stash binding must remain server-authoritative and not introduce client-authoritative item writes.",
  "Timer or sprite changes can accidentally make ordinary temporary spell access permanent or visually desynchronize the chest from its actual binding.",
]
verification_evidence = [
  "Read /tmp/barony-src/src/actchest.cpp:1705-1716: getter returns &stats[0]->void_chest_inventory when chestVoidState != 0.",
  "Read /tmp/barony-src/src/actchest.cpp:1773-1785: addItemToVoidChestServer initializes inventory to &stats[0]->void_chest_inventory.",
  "Read /tmp/barony-src/src/actchest.cpp:817-843: sprite 188 swaps to 1791 and lid sprite to 1790 while chestVoidState != 0; sprite 1791 reverts when chestVoidState == 0.",
  "Read /tmp/barony-src/src/actchest.cpp:1015-1027: chestVoidState decrements, is clamped while open, and erupts/updates when it reaches zero.",
]

[[runtime_source_map]]
name = "close_save_on_close_sites"
capability_ids = ["persistent_storage", "persistent_inventory", "void_chest_binding", "multiplayer_version_metadata"]
source_files = [
  "src/actchest.cpp:1249-1309",
]
observed_behavior = "Entity::closeChest handles local/client/server close transitions, sends the CCLS packet from client to server or server to remote client, clears chestStatus, clears openedChest, and closes the local chest GUI; Entity::closeChestServer clears server chestStatus/openedChest and closes the GUI."
intended_p3_change = "Use closeChest/closeChestServer as the post-interaction flush boundary for Stash mutations, writing only from the authoritative side and only for Void Chest/Stash-relevant interactions."
risks = [
  "Saving before server-side item transfer validation completes can persist rejected or partial inventory state.",
  "Both client and server close paths can run; duplicate writes or client-authoritative writes would risk multiplayer divergence.",
  "Unfiltered save-on-close could add avoidable I/O for ordinary chests.",
]
verification_evidence = [
  "Read /tmp/barony-src/src/actchest.cpp:1249-1309: closeChest and closeChestServer are centralized chest-close candidates that expose client/server authority boundaries.",
]

[[runtime_source_map]]
name = "spell_created_void_chest_route"
capability_ids = ["void_chest_binding", "persistent_inventory"]
source_files = [
  "src/magic/castSpell.cpp:4355-4384",
  "src/actchest.cpp:1015-1027",
]
observed_behavior = "SPELL_VOID_CHEST targets an existing actChest, optionally calls magicOnEntityHit when chestVoidState was zero, then sets target->chestVoidState = TICKS_PER_SECOND * 5, updates skill 17, and spawns void particles; actchest timer logic then makes that access temporary unless the chest is held open."
intended_p3_change = "Ensure spell-routed Void Chest access opens the same Stash inventory as permanent P3 placements while preserving the vanilla five-second temporary access window for spell use."
risks = [
  "A blanket timer disable would turn a temporary spell into a permanent world placement and alter spell balance.",
  "Leaving spell access bound to vanilla stats[0]->void_chest_inventory while permanent placements use another stash source would create two Void Chest inventories.",
  "Spell effects touch an existing chest entity; placement code must not assume every Stash access point was newly spawned by P3.",
]
verification_evidence = [
  "Read /tmp/barony-src/src/magic/castSpell.cpp:4355-4384: SPELL_VOID_CHEST routes through target actChest and sets chestVoidState to TICKS_PER_SECOND * 5.",
  "Read /tmp/barony-src/src/actchest.cpp:1015-1027: the chestVoidState timer provides the expiration path for spell-created Void Chest access.",
]

