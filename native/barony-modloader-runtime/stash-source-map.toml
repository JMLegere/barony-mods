[[runtime_source_map]]
name = "generated_shop_detection_shoparea_entity_copy"
capability_ids = ["placement_shop", "void_chest_binding", "persistent_inventory"]
source_files = [
  "src/maps.cpp:1303-1312",
  "src/maps.cpp:1475-1535",
  "src/maps.cpp:1999-2004",
  "src/maps.cpp:2569-2575",
  "src/maps.cpp:2610-2634",
]
observed_behavior = "Map generation decides shoplevel, loads a shop/shop-roomgen subroom into shopmap, selects shopmap as tempMap when c == 2 && shoplevel, marks interior generated tiles as shoparea, and copies each tempMap entity into map.entities with translated coordinates and generation room coordinates."
intended_p3_change = "Detect the generated-shop path and add one permanent purple Void Chest Stash access point to each generated shop at a point that preserves shoparea ownership, room coordinates, collision expectations, and copied template entities."
risks = [
  "Injecting too early may create a chest that is not copied or is missing generated-room metadata.",
  "Injecting too late may miss shoparea marking or create duplicate chests if generation retries/re-enters shop copy code.",
  "Using only the shoplevel flag can over-place in non-shop contexts; using only entity copy can miss rooms with no suitable copied anchor.",
  "A placed chest outside shoparea can fail merchant/shop interaction assumptions or block generated room navigation.",
]
verification_evidence = [
  "Read /tmp/barony-src/src/maps.cpp:1303-1312: shoplevel is set by gameplayCustomManager or random level conditions.",
  "Read /tmp/barony-src/src/maps.cpp:1475-1535: shop subroom files are counted, selected, and loaded into shopmap while shoplevel is true.",
  "Read /tmp/barony-src/src/maps.cpp:1999-2004: generated shop branch sets tempMap = &shopmap when c == 2 && shoplevel.",
  "Read /tmp/barony-src/src/maps.cpp:2569-2575: generated shop interior tiles are marked in shoparea.",
  "Read /tmp/barony-src/src/maps.cpp:2610-2634: entities from tempMap are copied into map.entities with translated x/y and mapGenerationRoomX/Y.",
]

