# BaronyModLoader v1.0 deliverables and evidence map.
# This is the active completion contract for the goal: maintain the todolist to finish v1.0.

[meta]
name = "BaronyModLoader v1.0 deliverables"
status = "active"
created = "2026-07-02"
objective = "A usable v1.0 BaronyModLoader path for the Stash reference mod, with a standalone app, clean package contract, paired Barony runtime patch artifacts, and verification evidence."

[[deliverables]]
id = "p1_loader_app"
status = "implemented"
summary = "Python stdlib CLI validates packages/runtimes, detects Steam Barony installs, creates profiles, and generates runtime manifests."
required_artifacts = [
  "framework/BaronyModLoader/app/barony_mod_loader.py",
  "framework/BaronyModLoader/schema/package.schema.json",
  "framework/BaronyModLoader/schema/profile.schema.json",
  "framework/BaronyModLoader/schema/runtime-manifest.schema.json",
  "framework/BaronyModLoader/fixtures/runtime-info.stash.json",
]
evidence = [
  "python framework/BaronyModLoader/app/barony_mod_loader.py package validate framework/BaronyModLoader/example-stash-package.json",
  "python framework/BaronyModLoader/app/barony_mod_loader.py runtime validate framework/BaronyModLoader/fixtures/runtime-info.stash.json --package framework/BaronyModLoader/example-stash-package.json",
  "profile create + launch-plan command produces runtime-manifest.json with canonical capabilities",
  "python framework/BaronyModLoader/app/barony_mod_loader.py steam detect reports appid 371970, local Steam build id, install path, executable, and stockExecutablePatched=false",
  "profile create --steam records the Steam install and launch-plan emits steam:371970:<buildid> as gameInstallId",
]

[[deliverables]]
id = "p2_installed_hook_contract"
status = "next"
summary = "Contracts and docs describe BML v1 as an installed PC executable hook/bootstrap runtime, not a source-built Barony runtime."
required_artifacts = [
  "framework/BaronyModLoader/installed-steam-hook-strategy.md",
  "framework/BaronyModLoader/current-situation-discovery.md",
  "framework/BaronyModLoader/schema/runtime-info.schema.json",
  "framework/BaronyModLoader/schema/runtime-load-report.schema.json",
  "framework/BaronyModLoader/schema/runtime-registry.schema.json",
]
evidence = [
  "source-build is not listed as a supported v1 runtime strategy",
  "PC storefront/platform matrix is documented as Steam Windows/macOS/Linux, Epic Windows/macOS, GOG Windows/macOS/Linux, and Humble Windows/macOS/Linux",
  "Nintendo Switch is explicitly out of scope",
  "runtime-info, runtime-load-report, and registry fixtures parse and match the schemas",
]

[[deliverables]]
id = "p3_noop_hook_bootstrap"
status = "planned"
summary = "BML-owned hook/bootstrap library loads in the installed Steam/Linux executable, validates provenance, and writes canonical reports without gameplay hooks."
required_artifacts = [
  "native/barony-modloader-hook/",
  "native/barony-modloader-hook/manifests/steam-371970-22630456-linux.json",
  "framework/BaronyModLoader/fixtures/runtime-info.installed-hook.stash.json",
]
evidence = [
  "BML launcher dry-run executes the installed Steam executable, not a source-built sidecar",
  "dry-run environment includes BML_RUNTIME_MANIFEST, BML_PROFILE_DIR, SteamAppId, SteamGameId, LD_LIBRARY_PATH, and hook preload configuration",
  "no-op hook writes runtime-load-report.json using the canonical schema",
  "mismatched executable provenance fails closed before gameplay hooks install",
]

[[deliverables]]
id = "p4_stash_hook_behavior"
status = "verification-plan-ready_pending-installed-hook"
summary = "Installed-executable hook runtime implements Stash behavior: persistent Void Chest inventory, spell/lobby/shop access, and save/multiplayer metadata."
required_artifacts = [
  "native/barony-modloader-runtime/stash-source-map.toml",
  "native/barony-modloader-runtime/stash-verification-plan.toml",
  "native/barony-modloader-hook/",
]
evidence = [
  "source map is used as semantic reference for Void Chest inventory, spell chest creation, lobby assist area, shop generation, and save/load hooks",
  "verification plan covers runtime manifest acceptance, persistence across death/new-run/relaunch, save/resume no-fork/no-duplicate behavior, lobby/shop placement, spell inventory binding, multiplayer mismatch rejection, and disabled behavior",
  "playable verification remains pending until the installed game executable plus hook runtime runs the focused Stash scenarios and captures the named evidence artifacts",
]

[[deliverables]]
id = "p5_packaging_release"
status = "current-package-workflow_needs-installed-hook-provenance"
summary = "BaronyModLoader can create/install/enable/disable a clean Stash package archive and should record installed-executable hook provenance without claiming gameplay behavior before verification."
required_artifacts = [
  "framework/BaronyModLoader/app/barony_mod_loader.py",
  "framework/BaronyModLoader/schema/release-manifest.schema.json",
  "framework/BaronyModLoader/fixtures/release-manifest.stash.json",
  "mods/stash/bml-package.json",
  "Stash-0.1.0.bmlpkg generated by package pack",
]
evidence = [
  "python framework/BaronyModLoader/app/barony_mod_loader.py package validate mods/stash",
  "python framework/BaronyModLoader/app/barony_mod_loader.py package pack mods/stash --out .tmp/Stash-0.1.0.bmlpkg",
  "python framework/BaronyModLoader/app/barony_mod_loader.py package install .tmp/Stash-0.1.0.bmlpkg --store .tmp/bml-package-store",
  "profile create --steam produces an installed PC game profile with executable provenance",
  "launch dry-run for a Steam-backed profile emits installed-executable hook command and provenance",
  "release manifest records app version, runtime version, installed executable provenance, hook library, symbol map, package checksum, rollback notes, and pending gameplay verification status",
]

[[deliverables]]
id = "v1_closeout"
status = "planned"
summary = "All v1 artifacts are verified, committed, and pushed. Remaining blockers are explicit if a playable runtime build cannot be completed in this environment."
required_artifacts = [
  "README.md",
  "framework/BaronyModLoader/README.md",
  "framework/BaronyModLoader/roadmap.toml",
]
evidence = [
  "git diff --check passes",
  "all JSON/TOML artifacts parse",
  "CLI focused commands pass",
  "git status is clean after commit",
  "origin/main matches HEAD after push",
]
