[[deliverables]]
id = "p3_symbol_probe_fail_closed_hook_gate"
status = "implemented_symbol_probe_fail_closed_hook_gate"
summary = "BML-owned Linux hook/bootstrap library validates installed Steam/Linux provenance, probes required Barony symbols, classifies Stash target readiness with the conservative detour decoder including REX-prefixed push/pop, register-only, and non-RIP-memory prologue windows, proves an opt-in fake-symbol Entity::addItemToVoidChestServer detour call-through path, writes canonical reports, and fails closed for required Stash gameplay hooks that are not yet installed."
required_artifacts = [
  "native/barony-modloader-hook/",
  "native/barony-modloader-hook/manifests/steam-371970-22630456-linux.json",
  "framework/BaronyModLoader/fixtures/hook-manifest.stash-v1.json",
  "framework/BaronyModLoader/fixtures/runtime-info.installed-hook.stash.json",
  "framework/BaronyModLoader/schema/runtime-load-report.schema.json",
  "framework/BaronyModLoader/schema/symbol-probe-report.schema.json",
  "framework/BaronyModLoader/schema/stash-hook-report.schema.json",
  "native/barony-modloader-hook/tools/analyze_stash_targets.py",
]
evidence = [
  "BML launcher dry-run executes the installed Steam executable, not a source-built sidecar",
  "dry-run environment includes BML_RUNTIME_MANIFEST, BML_PROFILE_DIR, SteamAppId, SteamGameId, LD_LIBRARY_PATH, and hook preload configuration",
  "Linux hook writes BaronyModLoader/reports/runtime-load-report.json using the canonical schema",
  "Linux hook writes BaronyModLoader/reports/symbol-probe-report.json after resolving required dlsym(RTLD_DEFAULT, mangledSymbol) targets for Steam app 371970 build 22630456",
  "Linux hook writes BaronyModLoader/reports/stash-hook-report.json with the abstract direct Stash hook backend, per-target ready/blocked/missing analysis, decoder-safe patchWindowBytes for ready function targets including REX/register/non-RIP-memory fake-symbol fixture paths, and failClosed=true until required gameplay hooks are actually installed",
  "BML_STASH_DETOUR_SELF_TEST=1 writes BaronyModLoader/reports/stash-detour-self-test-report.json proving the exact Entity::addItemToVoidChestServer symbol can be patched, routed through BML replacement code, and called through to the original fake-symbol implementation without claiming in-game Stash behavior",
  "python native/barony-modloader-hook/tools/analyze_stash_targets.py --manifest native/barony-modloader-hook/manifests/steam-371970-22630456-linux.json --executable /home/jerry/.local/share/Steam/steamapps/common/Barony/barony.x86_64 emits static-prologue readiness evidence with 19 ready targets, 15 blocked targets, 0 missing targets, and playableBehaviorClaimed=false",
  "mismatched executable provenance, missing required symbols, or uninstalled required Stash hook targets fail closed before runtime-load-report can claim Stash loaded",
]

