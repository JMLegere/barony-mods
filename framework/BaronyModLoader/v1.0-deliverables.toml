# BaronyModLoader v1.0 deliverables and evidence map.
# This is the active completion contract for the goal: maintain the todolist to finish v1.0.

[meta]
name = "BaronyModLoader v1.0 deliverables"
status = "active"
created = "2026-07-02"
objective = "A usable v1.0 BaronyModLoader path for the Stash reference mod, with a standalone app, clean package contract, paired Barony runtime patch artifacts, and verification evidence."

[[deliverables]]
id = "p1_loader_app"
status = "implemented"
summary = "Python stdlib CLI validates packages/runtimes, detects Steam Barony installs, creates profiles, and generates runtime manifests."
required_artifacts = [
  "framework/BaronyModLoader/app/barony_mod_loader.py",
  "framework/BaronyModLoader/schema/package.schema.json",
  "framework/BaronyModLoader/schema/profile.schema.json",
  "framework/BaronyModLoader/schema/runtime-manifest.schema.json",
  "framework/BaronyModLoader/fixtures/runtime-info.stash.json",
]
evidence = [
  "python framework/BaronyModLoader/app/barony_mod_loader.py package validate framework/BaronyModLoader/example-stash-package.json",
  "python framework/BaronyModLoader/app/barony_mod_loader.py runtime validate framework/BaronyModLoader/fixtures/runtime-info.stash.json --package framework/BaronyModLoader/example-stash-package.json",
  "profile create + launch-plan command produces runtime-manifest.json with canonical capabilities",
  "python framework/BaronyModLoader/app/barony_mod_loader.py steam detect reports appid 371970, local Steam build id, install path, executable, and stockExecutablePatched=false",
  "profile create --steam records the Steam install and launch-plan emits steam:371970:<buildid> as gameInstallId",
]

[[deliverables]]
id = "p2_runtime_handshake"
status = "next"
summary = "Source patch artifacts add Barony runtime manifest discovery, capability validation, --bml-runtime-info, and runtime load reports without gameplay changes."
required_artifacts = [
  "native/barony-modloader-runtime/patches/0001-bml-runtime-handshake.patch",
  "native/barony-modloader-runtime/README.md",
  "framework/BaronyModLoader/schema/runtime-info.schema.json",
  "framework/BaronyModLoader/schema/runtime-load-report.schema.json",
  "framework/BaronyModLoader/fixtures/runtime-load-report.loaded.json",
  "framework/BaronyModLoader/fixtures/runtime-load-report.failed.json",
]
evidence = [
  "patch applies cleanly to the tracked Barony source revision or documents why it is a planning patch",
  "runtime-info and runtime-load-report fixtures parse and match the schemas",
  "CLI runtime validation accepts the runtime-info fixture and fails closed for missing capabilities",
]

[[deliverables]]
id = "p3_stash_runtime_behavior"
status = "verification-plan-ready_pending-built-game"
summary = "Runtime patch implements Stash behavior: persistent Void Chest inventory, spell/lobby/shop access, and save/multiplayer metadata."
required_artifacts = [
  "native/barony-modloader-runtime/patches/0002-bml-stash-runtime.patch",
  "native/barony-modloader-runtime/stash-source-map.toml",
  "native/barony-modloader-runtime/stash-verification-plan.toml",
]
evidence = [
  "source map cites exact Barony files/lines for Void Chest inventory, spell chest creation, lobby assist area, shop generation, and save/load hooks",
  "stash-verification-plan.toml parses and records setup, commands/observations, pass/fail criteria, and evidence artifacts for every required Stash scenario",
  "verification plan covers runtime manifest acceptance, persistence across death/new-run/relaunch, save/resume no-fork/no-duplicate behavior, lobby/shop placement, spell inventory binding, multiplayer mismatch rejection, and disabled behavior",
  "stash-verification-plan.toml explicitly separates artifact verification from pending built-game behavioral verification",
  "P3 playable verification remains pending until a patched Barony build runs the focused Stash scenarios and captures the named evidence artifacts",
]

[[deliverables]]
id = "p4_packaging_release"
status = "current-package-workflow"
summary = "BaronyModLoader can create/install/enable/disable a clean Stash package archive and record release provenance without claiming built-game behavior is verified."
required_artifacts = [
  "framework/BaronyModLoader/app/barony_mod_loader.py",
  "framework/BaronyModLoader/schema/release-manifest.schema.json",
  "framework/BaronyModLoader/fixtures/release-manifest.stash.json",
  "mods/stash/bml-package.json",
  "Stash-0.1.0.bmlpkg generated by package pack",
]
evidence = [
  "python framework/BaronyModLoader/app/barony_mod_loader.py package validate mods/stash",
  "python framework/BaronyModLoader/app/barony_mod_loader.py package pack mods/stash --out .tmp/Stash-0.1.0.bmlpkg",
  "python framework/BaronyModLoader/app/barony_mod_loader.py package install .tmp/Stash-0.1.0.bmlpkg --store .tmp/bml-package-store",
  "python framework/BaronyModLoader/app/barony_mod_loader.py profile create .tmp/bml-profile --id default --barony-executable /path/to/barony --runtime-info framework/BaronyModLoader/fixtures/runtime-info.stash.json",
  "python framework/BaronyModLoader/app/barony_mod_loader.py profile enable .tmp/bml-profile --package .tmp/bml-package-store/jml.stash/0.1.0",
  "python framework/BaronyModLoader/app/barony_mod_loader.py profile inspect .tmp/bml-profile",
  "python framework/BaronyModLoader/app/barony_mod_loader.py launch-plan .tmp/bml-profile --package .tmp/bml-package-store/jml.stash/0.1.0 --runtime-info framework/BaronyModLoader/fixtures/runtime-info.stash.json --out .tmp/bml-profile/BaronyModLoader/runtime-manifest.json",
  "python framework/BaronyModLoader/app/barony_mod_loader.py profile disable .tmp/bml-profile --mod-id jml.stash",
  "release manifest records app version, runtime version, Barony source revision, patch artifacts, package checksum, rollback notes, and pending built-game verification status",
]

[[deliverables]]
id = "p5_steam_install_target"
status = "implemented_pending-runtime-build"
summary = "BaronyModLoader targets the Steam install cleanly by detecting appmanifest/build metadata and recording Steam-backed profiles without mutating the stock executable."
required_artifacts = [
  "framework/BaronyModLoader/app/barony_mod_loader.py",
  "framework/BaronyModLoader/README.md",
  "framework/BaronyModLoader/architecture.md",
]
evidence = [
  "python framework/BaronyModLoader/app/barony_mod_loader.py steam detect",
  "profile create --steam produces runtime.gameSource=steam and runtime.steam.buildId",
  "launch-plan for a Steam-backed profile emits gameInstallId=steam:371970:<buildid>",
  "Steam-backed Stash still requires a matching BML runtime executable; the stock Steam barony.x86_64 is detected as stockExecutablePatched=false",
]

[[deliverables]]
id = "v1_closeout"
status = "planned"
summary = "All v1 artifacts are verified, committed, and pushed. Remaining blockers are explicit if a playable runtime build cannot be completed in this environment."
required_artifacts = [
  "README.md",
  "framework/BaronyModLoader/README.md",
  "framework/BaronyModLoader/roadmap.toml",
]
evidence = [
  "git diff --check passes",
  "all JSON/TOML artifacts parse",
  "CLI focused commands pass",
  "git status is clean after commit",
  "origin/main matches HEAD after push",
]
